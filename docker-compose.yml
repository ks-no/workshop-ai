# Every Node service answers /helse with a "tjeneste" field. Without a
# healthcheck, depends_on only waits for the container to start - not for the
# server inside it to accept connections, which is where startup races come from.
# Node is present in all these images, so fetch is the cheapest probe available.
x-helsesjekk: &helsesjekk
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 3s

# Ports are loopback-only unless BIND_HOST says otherwise - see .env.example.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${BIND_HOST:-127.0.0.1}:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull-selected:
    image: ollama/ollama:latest
    profiles: ["pull"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull "$$OLLAMA_MODEL"
    volumes:
      - ollama-data:/root/.ollama
    restart: "no"

  ollama-pull-all:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    profiles: ["models"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODELS=qwen2.5:0.5b qwen2.5:7b qwen2.5:14b llama3.1:8b mistral-nemo
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for model in $$OLLAMA_MODELS; do
          echo "Pulling $$model"
          ollama pull "$$model"
        done
    volumes:
      - ollama-data:/root/.ollama
    restart: "no"

  process-builder:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/process-builder/src/server.ts"]
    environment:
      - WATCH_POLL=${WATCH_POLL:-0}
      # Klientkoden er .ts og strippes ved servering med
      # module.stripTypeScriptTypes(), som er merket eksperimentell og skriver en
      # advarsel per kall. Bare disse to serverer klientfiler, så bare de demper
      # den - en global demping ville skjult ekte advarsler andre steder.
      - NODE_OPTIONS=--disable-warning=ExperimentalWarning
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    volumes:
      - ./:/workspace

  demo-gui:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/demo-gui/src/server.ts"]
    environment:
      - WATCH_POLL=${WATCH_POLL:-0}
      # Klientkoden er .ts og strippes ved servering med
      # module.stripTypeScriptTypes(), som er merket eksperimentell og skriver en
      # advarsel per kall. Bare disse to serverer klientfiler, så bare de demper
      # den - en global demping ville skjult ekte advarsler andre steder.
      - NODE_OPTIONS=--disable-warning=ExperimentalWarning
    ports:
      - "${BIND_HOST:-127.0.0.1}:3001:3001"
    volumes:
      - ./:/workspace

  digdir-mock:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:8086/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    # Node strips the types on load, so .ts runs with no build step - the same
    # way sandbox-backend does. See tsconfig.json.
    command: ["/bin/sh", "scripts/dev.sh", "apps/digdir-mock/src/server.ts"]
    environment:
      - PORT=8086
      - WATCH_POLL=${WATCH_POLL:-0}
      # The logical issuer name, which goes into `iss`. It is the address the
      # *browser* uses, not the one services use inside the network: demo-gui gets
      # its token from localhost:8086, and sandbox-backend must accept that same
      # `iss` when it verifies it. DIGDIR_BASE_URL is the dial address instead.
      - DIGDIR_ISSUER=${DIGDIR_ISSUER:-http://localhost:8086}
      # Standarden i koden er 120 sekunder, som holder for en tjeneste: klient.ts
      # fornyer selv, og ingen merker det. En deltaker som logger inn i
      # API-utforskeren gjør ikke det - der betyr to minutter at alt plutselig
      # svarer 401 uten at noe sier hvorfor. En time dekker en økt.
      - DIGDIR_TOKEN_TTL=${DIGDIR_TOKEN_TTL:-3600}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8086:8086"
    volumes:
      - ./:/workspace

  sandbox-backend:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/sandbox-backend/src/server.ts"]
    environment:
      # The backend no longer reads the matrikkel seed off disk. One matrikkel in
      # the sandbox, and it is the one that also speaks SOAP.
      - MATRIKKEL_BASE_URL=http://matrikkel-mock:8085
      # Two settings, deliberately: where we dial the issuer, and what we accept in
      # `iss`. Inside the network the issuer is digdir-mock:8086; the token a
      # browser holds says localhost:8086. Conflating them is an issuer mismatch.
      - DIGDIR_BASE_URL=http://digdir-mock:8086
      - DIGDIR_ISSUER=${DIGDIR_ISSUER:-http://localhost:8086}
      - AUTH_ENFORCE=${AUTH_ENFORCE:-true}
      - WATCH_POLL=${WATCH_POLL:-0}
    depends_on:
      matrikkel-mock:
        condition: service_healthy
      digdir-mock:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:8080:8080"
    volumes:
      - ./:/workspace

  fiks-simulator:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/fiks-simulator/src/server.ts"]
    environment:
      - BACKEND_BASE_URL=http://sandbox-backend:8080
      - DIGDIR_BASE_URL=http://digdir-mock:8086
      - DIGDIR_ISSUER=${DIGDIR_ISSUER:-http://localhost:8086}
      - AUTH_ENFORCE=${AUTH_ENFORCE:-true}
      - WATCH_POLL=${WATCH_POLL:-0}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8081:8081"
    volumes:
      - ./:/workspace

  matrikkel-mock:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:8085/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/matrikkel-mock/src/server.ts"]
    environment:
      - PORT=8085
      - WATCH_POLL=${WATCH_POLL:-0}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8085:8085"
    volumes:
      - ./:/workspace

  brreg-mcp:
    image: node:26-alpine
    working_dir: /workspace
    command: ["node", "apps/brreg-mcp/src/server.ts"]
    environment:
      - BRREG_DATA_FILE=/workspace/data/brreg.seed.json
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace

  folkeregister-mcp:
    image: node:26-alpine
    working_dir: /workspace
    command: ["node", "apps/folkeregister-mcp/src/server.ts"]
    environment:
      - FOLKEREGISTER_DATA_FILE=/workspace/data/folkeregister.seed.json
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace

  ai-gateway:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:8082/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/ai-gateway/src/server.ts"]
    depends_on:
      ollama:
        condition: service_healthy
      digdir-mock:
        condition: service_healthy
    environment:
      - BACKEND_BASE_URL=http://sandbox-backend:8080
      - DIGDIR_BASE_URL=http://digdir-mock:8086
      - DIGDIR_ISSUER=${DIGDIR_ISSUER:-http://localhost:8086}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-mistralai/mistral-7b-instruct:free}
      # Both timeouts are read by the gateway but were not passed through here,
      # so setting AI_TIMEOUT_MS in .env - which .env.example documents - did
      # nothing at all. A documented knob that is not wired up is worse than no
      # knob: it sends people looking for the problem somewhere else.
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-180000}
      - AI_SPORSMAAL_TIMEOUT_MS=${AI_SPORSMAAL_TIMEOUT_MS:-45000}
      # Named BEDROCK_AWS_* rather than the plain AWS_* names on purpose: a
      # developer's shell commonly already exports AWS_ACCESS_KEY_ID/etc for their
      # own unrelated credentials, and both Compose's ${VAR:-default} and Node's
      # --env-file prefer an already-set shell variable over .env - silently
      # pairing their personal key with this service's short-lived session token.
      - BEDROCK_AWS_REGION=${BEDROCK_AWS_REGION:-eu-north-1}
      - BEDROCK_AWS_ACCESS_KEY_ID=${BEDROCK_AWS_ACCESS_KEY_ID:-}
      - BEDROCK_AWS_SECRET_ACCESS_KEY=${BEDROCK_AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_AWS_SESSION_TOKEN=${BEDROCK_AWS_SESSION_TOKEN:-}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-eu.anthropic.claude-sonnet-4-5-20250929-v1:0}
      - WATCH_POLL=${WATCH_POLL:-0}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8082:8082"
    volumes:
      - ./:/workspace

  tools-api:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:8083/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/tools-api/src/server.ts"]
    # service_healthy, not just service_started: tools-api proxies straight
    # through to all three on the first request.
    #
    # brreg-mcp and folkeregister-mcp are deliberately NOT listed. tools-api
    # never calls them - it reads data/brreg.seed.json and
    # data/folkeregister.seed.json straight off disk (see src/server.ts) and
    # exposes its own REST equivalents. They are standalone stdio MCP servers for
    # external clients, with no HTTP surface, so service_healthy could never be
    # satisfied for them either.
    depends_on:
      sandbox-backend:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
      matrikkel-mock:
        condition: service_healthy
      digdir-mock:
        condition: service_healthy
    environment:
      - BACKEND_BASE_URL=http://sandbox-backend:8080
      - AI_BASE_URL=http://ai-gateway:8082
      - MATRIKKEL_BASE_URL=http://matrikkel-mock:8085
      - DIGDIR_BASE_URL=http://digdir-mock:8086
      - DIGDIR_ISSUER=${DIGDIR_ISSUER:-http://localhost:8086}
      # mock, and the same value in the code default and .env.example - one value in
      # all three places. The seed holds all 220 Bergen streets, so a live lookup has
      # nothing left to add and the conference network cannot break a street lookup.
      # hybrid tries Geonorge first and falls back to the seed; use it for streets
      # outside the seed. Not live, which rethrows on network failure and turns every
      # street lookup into a 500 when you are offline.
      - MATRIKKEL_MODE=${MATRIKKEL_MODE:-mock}
      - GEONORGE_ADRESSE_API_BASE_URL=${GEONORGE_ADRESSE_API_BASE_URL:-https://ws.geonorge.no/adresser/v1}
      - BRREG_DATA_FILE=/workspace/data/brreg.seed.json
      - FOLKEREGISTER_DATA_FILE=/workspace/data/folkeregister.seed.json
      - WATCH_POLL=${WATCH_POLL:-0}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8083:8083"
    volumes:
      - ./:/workspace

  process-agent:
    healthcheck:
      <<: *helsesjekk
      test: ["CMD", "node", "-e", "fetch('http://localhost:8084/helse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    image: node:26-alpine
    working_dir: /workspace
    command: ["/bin/sh", "scripts/dev.sh", "apps/process-agent/src/server.ts"]
    depends_on:
      tools-api:
        condition: service_healthy
    environment:
      - TOOLS_BASE_URL=http://tools-api:8083
      - WATCH_POLL=${WATCH_POLL:-0}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8084:8084"
    volumes:
      - ./:/workspace

volumes:
  ollama-data:

