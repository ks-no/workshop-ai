name: SBOM images

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.gpu.yml
      - "**/Dockerfile*"
      - .github/workflows/sbom-images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finn-images:
    runs-on: ubuntu-latest
    if: github.repository == 'ks-no/workshop-ai'
    outputs:
      images: ${{ steps.les.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Les imagene ut av compose og Dockerfilene
        id: les
        run: |
          set -euo pipefail
          {
            grep -hoE '^[[:space:]]*image:[[:space:]]*[^[:space:]]+' \
              docker-compose.yml docker-compose.gpu.yml
            git ls-files '*Dockerfile*' | xargs -r grep -hoE '^FROM[[:space:]]+[^[:space:]]+'
          } | awk '{print $2}' | sort -u > images.txt
          cat images.txt
          test -s images.txt
          echo "images=$(jq -R . < images.txt | jq -cs .)" >> "$GITHUB_OUTPUT"

  images:
    needs: finn-images
    runs-on: ubuntu-latest
    # Forks get an empty DEPENDENCY_TRACK_API_KEY, so this job would fail while
    # still calling KS's Dependency-Track. Keep the run in the origin repo only.
    if: github.repository == 'ks-no/workshop-ai'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.finn-images.outputs.images) }}
    steps:
      - name: Utled prosjektnavn og versjon
        id: navn
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          tag="${IMAGE##*:}"
          repo="${IMAGE%:*}"
          if [ "$repo" = "$IMAGE" ]; then
            tag="latest"
          fi
          echo "project=workshop-ai-${repo##*/}" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: v1.51.1

      - name: Lag CycloneDX-BOM
        env:
          IMAGE: ${{ matrix.image }}
          PROJECT: ${{ steps.navn.outputs.project }}
          VERSION: ${{ steps.navn.outputs.version }}
        run: |
          syft "registry:$IMAGE" \
            --source-name "$PROJECT" \
            --source-version "$VERSION" \
            -o 'cyclonedx-json@1.6=bom.json'

      # project_version sendes ikke: da bruker actionen "main", og hver opplasting
      # lander på samme DT-prosjekt. Sendte vi taggen, ville et retagg minte et nytt
      # prosjekt og latt det gamle stå aktivt med en BOM ingen oppdaterer. Taggen er
      # ikke tapt - syft skriver den inn i BOM-en som source-version. sbom.yml gjør
      # det samme, og har aldri hatt problemet.
      - name: SBOM Upload and Report
        uses: ks-no/github-actions-public/sbom-upload-and-report@main
        with:
          dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project_name: ${{ steps.navn.outputs.project }}

      # The image tag is the DT project version, so a retag leaves the old project
      # active with a BOM nobody refreshes. The project name is the last path segment
      # of the image and has to stay unique across the matrix: two legs sharing a name
      # would deactivate each other. DT_BASE_URL is a second copy of the host the
      # upload action holds internally; the action exports neither it nor the uuid.
      - name: Deaktiver eldre versjoner av prosjektet i Dependency-Track
        continue-on-error: true
        env:
          DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          DT_BASE_URL: https://dt.fiks.dev.ks.no
          PROJECT: ${{ steps.navn.outputs.project }}
          VERSION: ${{ steps.navn.outputs.version }}
        run: |
          set -uo pipefail
          # DT matcher name som delstreng, så jq gjentar likhetstesten.
          curl -fsS --get -H "X-Api-Key: $DT_API_KEY" \
            --data-urlencode "name=$PROJECT" -d excludeInactive=true -d pageSize=500 \
            "$DT_BASE_URL/api/v1/project" \
            | jq -r --arg n "$PROJECT" --arg v "$VERSION" \
                '.[] | select(.name == $n and .version != $v) | "\(.uuid) \(.version)"' \
            | while read -r uuid version; do
                curl -fsS -o /dev/null -X PATCH \
                  -H "X-Api-Key: $DT_API_KEY" -H "Content-Type: application/json" \
                  -d '{"active": false}' "$DT_BASE_URL/api/v1/project/$uuid" \
                  && echo "Deaktiverte $PROJECT @ $version" \
                  || echo "::warning::Fikk ikke deaktivert $PROJECT @ $version"
              done

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.navn.outputs.project }}-${{ steps.navn.outputs.version }}
          path: bom.json
