name: SBOM images

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.gpu.yml
      - "**/Dockerfile*"
      - .github/workflows/sbom-images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finn-images:
    runs-on: ubuntu-latest
    if: github.repository == 'ks-no/workshop-ai'
    outputs:
      images: ${{ steps.les.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Les imagene ut av compose og Dockerfilene
        id: les
        run: |
          set -euo pipefail
          {
            grep -hoE '^[[:space:]]*image:[[:space:]]*[^[:space:]]+' \
              docker-compose.yml docker-compose.gpu.yml
            git ls-files '*Dockerfile*' | xargs -r grep -hoE '^FROM[[:space:]]+[^[:space:]]+'
          } | awk '{print $2}' | sort -u > images.txt
          cat images.txt
          test -s images.txt
          echo "images=$(jq -R . < images.txt | jq -cs .)" >> "$GITHUB_OUTPUT"

  images:
    needs: finn-images
    runs-on: ubuntu-latest
    # Forks get an empty DEPENDENCY_TRACK_API_KEY, so this job would fail while
    # still calling KS's Dependency-Track. Keep the run in the origin repo only.
    if: github.repository == 'ks-no/workshop-ai'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.finn-images.outputs.images) }}
    steps:
      - name: Utled prosjektnavn og versjon
        id: navn
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          tag="${IMAGE##*:}"
          repo="${IMAGE%:*}"
          if [ "$repo" = "$IMAGE" ]; then
            tag="latest"
          fi
          echo "project=workshop-ai-${repo##*/}" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: v1.51.1

      - name: Lag CycloneDX-BOM
        env:
          IMAGE: ${{ matrix.image }}
          PROJECT: ${{ steps.navn.outputs.project }}
          VERSION: ${{ steps.navn.outputs.version }}
        run: |
          syft "registry:$IMAGE" \
            --source-name "$PROJECT" \
            --source-version "$VERSION" \
            -o 'cyclonedx-json@1.6=bom.json'

      # A binary built without a version stamp becomes UNKNOWN in the BOM, and syft
      # then writes a CPE with a wildcard in the version field, which matches every
      # CVE ever filed for the product. The image tag is the version we run.
      - name: Stemple versjon der bygget ikke gjorde det
        env:
          VERSION: ${{ steps.navn.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '
            .components |= map(
              if .purl and .version == "UNKNOWN"
              then .version = $v
                 | if .cpe then .cpe = (.cpe | split(":") | .[5] = $v | join(":")) else . end
              else . end)
          ' bom.json > bom.stemplet.json
          mv bom.stemplet.json bom.json

      # project_version sendes ikke: da bruker actionen "main", og hver opplasting
      # lander på samme DT-prosjekt. Sendte vi taggen, ville et retagg minte et nytt
      # prosjekt og latt det gamle stå aktivt med en BOM ingen oppdaterer. Taggen er
      # ikke tapt - syft skriver den inn i BOM-en som source-version. sbom.yml gjør
      # det samme, og har aldri hatt problemet.
      - name: SBOM Upload and Report
        uses: ks-no/github-actions-public/sbom-upload-and-report@main
        with:
          dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project_name: ${{ steps.navn.outputs.project }}

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.navn.outputs.project }}-${{ steps.navn.outputs.version }}
          path: bom.json
