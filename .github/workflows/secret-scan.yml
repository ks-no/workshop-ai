name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the checked-out ref

      - uses: gitleaks/gitleaks-action@v2
        # GITLEAKS_LICENSE is only required for org-owned repos; this is a personal-account
        # private repo so it's omitted here - add it if the repo ever moves under an org.

      - name: Block NEXT_PUBLIC_ vars from carrying Telenor/CF AI Gateway secrets to the client bundle
        run: |
          # grep exits 1 on no match / 0 on a match, which is backwards for a CI gate -
          # invert it so a hit (leak) fails the build and no hit (clean) passes.
          if grep -rnE 'NEXT_PUBLIC_[A-Za-z0-9_]*.*(TELENOR|CF_AI_GATEWAY)|(TELENOR|CF_AI_GATEWAY).*NEXT_PUBLIC_[A-Za-z0-9_]*' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.github .; then
            echo "::error::Found a NEXT_PUBLIC_ variable alongside TELENOR/CF_AI_GATEWAY - this would ship the key or base URL to the client bundle."
            exit 1
          fi
          echo "No NEXT_PUBLIC_ / TELENOR|CF_AI_GATEWAY collision found."
          exit 0
