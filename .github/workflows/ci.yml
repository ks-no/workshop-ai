# Only the checks that need neither a running stack nor a language model.
#
# Deliberately excluded: pnpm test:eval (needs a live model — see evals/README.md)
# and the test:agent* / test:*-matrikkel scripts (need the compose stack up).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sjekker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-checks the .ts modules in sandbox-backend. checkJs is off, so the
      # .js services are not covered — see tsconfig.json.
      - name: Typesjekk
        run: pnpm lint

      # Referential integrity plus scenario and target-group coverage across the
      # datasets. Catches a dataset that has quietly lost a threshold case.
      - name: Valider syntetiske data
        run: pnpm test

      # The guardrails on /ai/sporsmaal as pure functions: decision language,
      # ungrounded amounts, false completion claims, prompt injection, and the
      # projection that keeps identifiers out of a prompt. No model needed, so
      # unlike test:eval it can gate every PR.
      - name: Sperrer på frie spørsmål
        run: pnpm test:sperrer

      # Address-protection masking as pure functions against the real seed. The
      # kontrakt dump below records the masked shape on the wire, but a dump can
      # only differ — it cannot fail. This step can.
      - name: Skjerming av adressebeskyttede
        run: pnpm test:skjerming

      # The vedtak itself, as pure functions against literal fixtures. Needs no
      # stack and no model. This is not a duplicate of `pnpm test`: that one drives
      # the same rule over the seed, and the seed cannot reach an ordning with only
      # one bound set — the shape where the gate's old hand-written mirror disagreed
      # with the rule. Only fixtures reach it. Same for TJENESTEBEHOV's dead
      # rejection branches and the UTKAST forbehold, which the kontrakt dump never
      # touches because every household it visits has a finished skatteoppgjør.
      - name: Vilkårsvurderingen
        run: pnpm test:vilkaar

      # Modulus 11 and Skatteetaten's +80 marker, as pure functions. The seed only
      # contains numbers we generate, so every *rejection* — an ordinary month, a
      # wrong second control digit, an individual number whose mod-11 rest is 10 —
      # exists here or nowhere. The D-number branch has no seed data at all.
      - name: Fødselsnummer
        run: pnpm test:foedselsnummer

      # Who may act, and on whose behalf, as pure functions. The order of the
      # refusals only exists in fixtures: the seed has no dead minor, and only 32
      # of 250 children have foreldreansvar named to one parent rather than felles,
      # so the narrowing path is thin there and load-bearing here.
      - name: Handleevne
        run: pnpm test:handleevne

      # The samtykke state machine, expiry and the write queue. Half pure functions,
      # half a real fiks-simulator on 18091 against a temp STATE_DIR — the lost-update
      # and double-answer cases only exist over HTTP.
      - name: Samtykkets tilstandsmaskin
        run: pnpm test:samtykke

      # The lost update on prosessoekter.json. Every handler used to write the whole
      # array from its own request-scoped copy, so two requests on different økter
      # raced and the second silently dropped the first one's change. With the bug
      # restored, 2 of 10 sessions survive on disk. Backend + digdir on their own
      # ports against a temp STATE_DIR; no model, no stack.
      - name: Samtidige prosessøkter
        run: pnpm test:concurrency

      # Every route in the code against every path in the six specs: coverage both
      # ways, methods, duplicate path keys, security per route and the kodeverk the
      # specs repeat. Needs neither stack nor model.
      - name: OpenAPI-dekning
        run: pnpm test:openapi

      # Every service list, tool count and population figure in the prose has a
      # machine-readable source. On 22.08.2026 every measured mismatch sat in a
      # hand-typed copy and never in the source — three service tables said eight
      # where there are nine, and this CI list itself was documented as seven
      # checks in two files. Nothing compared the two until this step.
      - name: Dokumentasjonen mot kilden
        run: pnpm test:docs

      # Starts its own backend + fiks on 18080/18081 against a temp STATE_DIR and
      # writes a normalised dump. Two runs of the same code are byte-identical, so
      # a diff here means the wire contract moved.
      - name: Kontraktsdump
        run: pnpm test:kontrakt --ut kontrakt-ci.json

      - name: Last opp kontraktsdump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kontraktsdump
          path: kontrakt-ci.json
          if-no-files-found: warn
