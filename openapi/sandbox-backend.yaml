openapi: 3.1.0
info:
  title: Sandbox Backend API
  version: 0.1.0
  description: API for prosesser, syntetiske data, søknader og revisjonslogg.
servers:
  - url: http://localhost:8080
paths:
  /helse:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/prosesser:
    get:
      summary: List prosesser
      parameters:
        - name: inkluderMaler
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Returnerer ogsa prosessmaler nar satt til true.
      responses:
        "200":
          description: Prosessliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProsessDefinisjon"
    post:
      summary: Opprett prosess
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProsessDefinisjonInput"
      responses:
        "201":
          description: Prosess opprettet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
  /api/prosesser/{prosessId}:
    get:
      summary: Hent prosess
      parameters:
        - name: prosessId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosess returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
    put:
      summary: Oppdater prosess
      parameters:
        - name: prosessId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosess oppdatert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
  /api/prosessoekter:
    post:
      summary: Opprett prosessøkt
      responses:
        "201":
          description: Prosessøkt opprettet
  /api/prosessoekter/{oektsId}:
    get:
      summary: Hent prosessøkt
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosessøkt returnert
  /api/prosessoekter/{oektsId}/svar:
    post:
      summary: Lagre svar i prosessøkt
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Svar lagret
  /api/prosessoekter/{oektsId}/handling:
    post:
      summary: Utfør aktiv steg-handling
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Handling utført
  /api/prosessoekter/{oektsId}/neste:
    post:
      summary: Gå til neste steg
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Neste steg aktivert
  /api/prosessoekter/{oektsId}/forrige:
    post:
      summary: Gå til forrige steg
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Forrige steg aktivert
  /api/personer:
    get:
      summary: List syntetiske personer
      responses:
        "200":
          description: Personer returnert
  /api/personer/{personId}/inntekt:
    get:
      summary: Hent inntekt for person
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inntekt returnert
        "403":
          description: Samtykke mangler

  /api/regler/satser:
    get:
      summary: Hent moderasjonsordninger med regler og inntektsgrenser
      description: >
        Satsene eies av kommunen og ligger i data/satser.json. Inntektsgrunnlaget
        beregnes derimot av fiks-simulator.
      responses:
        "200":
          description: Satser returnert

  /api/regler/sjekk/foreldrebetaling:
    get:
      summary: Vurder rett til en moderasjonsordning
      description: >
        Deterministisk vurdering av inntektsgrunnlaget mot ordningen. Brukes av
        SJEKK-steg i prosessdefinisjoner. KI forklarer utfallet, men avgjør det
        aldri, jf. ai-no-decisions i policies/ai-policy.yaml.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
        - name: ordning
          in: query
          required: true
          description: Ordnings-id fra /api/regler/satser
          schema:
            type: string
            example: redusert-foreldrebetaling-barnehage
      responses:
        "200":
          description: Vurdering utfoert
          content:
            application/json:
              schema:
                type: object
                required: [godkjent, melding]
                properties:
                  godkjent:
                    type: boolean
                  melding:
                    type: string
                  grunnlag:
                    type: object
                    description: Tallene bak utfallet, inkludert beregningsbeloep og terskel.
        "400":
          description: Ukjent ordning eller manglende parameter

  /api/husstander/{husstandId}/inntektsgrunnlag:
    get:
      summary: Hent husholdningens inntektsgrunnlag
      description: Henter beregningen fra fiks-simulator for hele husholdningen.
      parameters:
        - name: husstandId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Beregning returnert
        "404":
          description: Fant ikke husstand

  /api/revisjonslogg:
    get:
      summary: Hent hele revisjonsloggen
      responses:
        "200":
          description: Revisjonslogg returnert
    post:
      summary: Registrer en revisjonshendelse
      description: >
        Denne tjenesten eier revisjonsloggen. Andre tjenester, som
        fiks-simulator og ai-gateway, sender hendelser hit i stedet for å
        skrive loggfilen selv, slik at det bare finnes én skriver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handling]
              properties:
                handling:
                  type: string
                  example: SAMTYKKE_OPPRETTET
                ressurs:
                  type: string
                sporingsId:
                  type: string
                aktor:
                  type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
      responses:
        "201":
          description: Hendelsen er registrert
        "400":
          description: Hendelsen mangler handling

components:
  schemas:
    RedigeringMeta:
      type: object
      description: Valgfri metadata for enklere redigering av prosessdefinisjoner.
      additionalProperties: true
      properties:
        status:
          type: string
          description: For eksempel publisert eller template.
        mal:
          type: boolean
          description: Marker prosessen som mal i katalogen.
        eier:
          type: string
        hjelpetekst:
          type: string
    ProsessSteg:
      type: object
      additionalProperties: true
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
        tittel:
          type: string
        tekst:
          type: string
    ProsessDefinisjonInput:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        versjon:
          type: string
        redigering:
          $ref: "#/components/schemas/RedigeringMeta"
        steg:
          type: array
          items:
            $ref: "#/components/schemas/ProsessSteg"
    ProsessDefinisjon:
      allOf:
        - $ref: "#/components/schemas/ProsessDefinisjonInput"
        - type: object
          required: [id, navn, versjon, steg]
          properties:
            syntetisk:
              type: boolean

