openapi: 3.1.0
info:
  title: Sandbox Backend API
  version: 0.1.0
  description: API for prosesser, syntetiske data, søknader og revisjonslogg.
servers:
  - url: http://localhost:8080
paths:
  /helse:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/prosesser:
    get:
      summary: List prosesser
      parameters:
        - name: inkluderMaler
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Returnerer ogsa prosessmaler nar satt til true.
      responses:
        "200":
          description: Prosessliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProsessDefinisjon"
    post:
      summary: Opprett prosess
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProsessDefinisjonInput"
      responses:
        "201":
          description: Prosess opprettet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
  /api/prosesser/{prosessId}:
    get:
      summary: Hent prosess
      parameters:
        - name: prosessId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosess returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
    put:
      summary: Oppdater prosess
      parameters:
        - name: prosessId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosess oppdatert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProsessDefinisjon"
  /api/prosessoekter:
    post:
      summary: Opprett prosessøkt
      responses:
        "201":
          description: Prosessøkt opprettet
  /api/prosessoekter/{oektsId}:
    get:
      summary: Hent prosessøkt
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prosessøkt returnert
  /api/prosessoekter/{oektsId}/svar:
    post:
      summary: Lagre svar i prosessøkt
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Svar lagret
  /api/prosessoekter/{oektsId}/handling:
    post:
      summary: Utfør aktiv steg-handling
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Handling utført
  /api/prosessoekter/{oektsId}/neste:
    post:
      summary: Gå til neste steg
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Neste steg aktivert
  /api/prosessoekter/{oektsId}/forrige:
    post:
      summary: Gå til forrige steg
      parameters:
        - name: oektsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Forrige steg aktivert
  /api/personer:
    get:
      summary: List syntetiske personer
      responses:
        "200":
          description: Personer returnert
  /api/personer/{personId}:
    get:
      summary: Hent én person
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Person returnert
        "404":
          description: Fant ikke person

  /api/personer/{personId}/husstand:
    get:
      summary: Hent husstanden personen tilhoerer
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Husstand returnert
        "404":
          description: Fant ikke person eller husstand

  /api/personer/{personId}/inntekt:
    get:
      summary: Hent inntekt for person
      description: >
        Krever registrert samtykke for datakilden "inntekt", jf. regelen
        consent-before-income i policies/access-policy.yaml. Alle treff
        revisjonslogges, ogsaa naar tilgangen nektes.
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Inntekt returnert
        "403":
          description: Samtykke mangler

  /api/personer/{personId}/barnehage:
    get:
      summary: Hent barnehageplasser for barna i husstanden
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Barnehageplasser returnert
        "404":
          description: Fant ikke person

  /api/personer/{personId}/sfo:
    get:
      summary: Hent SFO-plasser for barna i husstanden
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: SFO-plasser returnert
        "404":
          description: Fant ikke person

  /api/personer/{personId}/soknader:
    get:
      summary: List soeknader personen har sendt inn
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Soeknader returnert

  /api/soknader:
    post:
      summary: Opprett en soeknad
      description: Oppretter samtidig en oppgave i fiks-simulator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, prosessId]
              properties:
                personId:
                  type: string
                prosessId:
                  type: string
                prosessNavn:
                  type: string
                sporingsId:
                  type: string
      responses:
        "201":
          description: Soeknad opprettet

  /api/soknader/{soknadId}:
    get:
      summary: Hent én soeknad
      parameters:
        - name: soknadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Soeknad returnert
        "404":
          description: Fant ikke soeknad

  /api/katalog/datasett:
    get:
      summary: List de syntetiske datasettene
      responses:
        "200":
          description: Datasett returnert

  /api/katalog/informasjonsmodeller:
    get:
      summary: List informasjonsmodellene datasettene laaner vokabular fra
      responses:
        "200":
          description: Informasjonsmodeller returnert

  /api/katalog/ressurser:
    get:
      summary: List ressursene DATA_FETCH- og SJEKK-steg kan peke paa
      description: >
        Ressurskatalogen i apps/sandbox-backend/src/ressurser.ts. Hver oppfoering
        er samtidig et HTTP-endepunkt, et gyldig DATA_FETCH-maal og et gyldig
        SJEKK-maal. Bruk denne i stedet for aa gjette URL-er naar du skriver et
        nytt steg.
      responses:
        "200":
          description: Ressurskatalog returnert
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [metode, sti, ressurs]
                  properties:
                    metode:
                      type: string
                      example: GET
                    sti:
                      type: string
                      example: /api/personer/:personId/inntekt
                    ressurs:
                      type: string
                      description: Navnet ressursen faar i revisjonsloggen.
                    beskrivelse:
                      type: string
                    kreverSamtykke:
                      type: string
                      nullable: true
                      description: Datakilde det maa foreligge samtykke for, eller null.

  /api/matrikkel/gater:
    get:
      summary: List gater, eller hent noekkeltall for én gate
      description: >
        Uten ?gate returneres en liste. Med ?gate returneres en projeksjon uten
        eiendomslisten, siden den inneholder personId-ene til andre innbyggere.
      parameters:
        - name: gate
          in: query
          required: false
          schema:
            type: string
            example: Storgata
      responses:
        "200":
          description: Gate eller gateliste returnert
        "404":
          description: Fant ikke gaten

  /api/matrikkel/sjekk/eierforhold:
    get:
      summary: Vurder om soekeren eier eiendom i en gitt gate
      description: Brukes av SJEKK-steg. Foelger samme kontrakt som andre sjekker.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
        - name: gate
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vurdering utfoert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SjekkResultat"

  /api/matrikkel/gater:
    get:
      summary: Søk i tilgjengelige gater i matrikkeldata
      description: Returnerer alle tilgjengelige gater, eller alle treff som matcher hele eller deler av et gatenavn.
      parameters:
        - name: gate
          in: query
          required: false
          schema:
            type: string
          description: Hele eller deler av gatenavn.
      responses:
        "200":
          description: Liste over gater eller treff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatrikkelGateSummary"
        "404":
          description: Fant ingen matchende gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/matrikkel/sjekk/eierforhold:
    get:
      summary: Sjekk om en person er registrert som eier i en gate
      parameters:
        - name: gate
          in: query
          required: true
          schema:
            type: string
        - name: personId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eierforhold vurdert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrikkelEierforholdSjekk"
        "404":
          description: Fant ikke gaten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/regler/satser:
    get:
      summary: Hent moderasjonsordninger med regler og inntektsgrenser
      description: >
        Satsene eies av kommunen og ligger i data/satser.json. Inntektsgrunnlaget
        beregnes derimot av fiks-simulator.
      responses:
        "200":
          description: Satser returnert

  /api/regler/sjekk/foreldrebetaling:
    get:
      summary: Vurder rett til en moderasjonsordning
      description: >
        Deterministisk vurdering av inntektsgrunnlaget mot ordningen. Brukes av
        SJEKK-steg i prosessdefinisjoner. KI forklarer utfallet, men avgjør det
        aldri, jf. ai-no-decisions i policies/ai-policy.yaml.
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
        - name: ordning
          in: query
          required: true
          description: Ordnings-id fra /api/regler/satser
          schema:
            type: string
            example: redusert-foreldrebetaling-barnehage
      responses:
        "200":
          description: Vurdering utfoert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SjekkResultat"
        "400":
          description: Ukjent ordning eller manglende parameter
        "403":
          description: >
            Samtykke mangler. Vurderingen roeper husholdningens
            inntektsgrunnlag og er derfor underlagt samme samtykkekrav som
            /api/personer/{personId}/inntekt.

  /api/husstander/{husstandId}/inntektsgrunnlag:
    get:
      summary: Hent husholdningens inntektsgrunnlag
      description: >
        Henter beregningen fra fiks-simulator for hele husholdningen. Samme data
        som personruta, og derfor samme samtykkekrav.
      parameters:
        - name: husstandId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Beregning returnert
        "403":
          description: Samtykke mangler
        "404":
          description: Fant ikke husstand

  /api/revisjonslogg:
    get:
      summary: Hent hele revisjonsloggen
      responses:
        "200":
          description: Revisjonslogg returnert
    post:
      summary: Registrer en revisjonshendelse
      description: >
        Denne tjenesten eier revisjonsloggen. Andre tjenester, som
        fiks-simulator og ai-gateway, sender hendelser hit i stedet for å
        skrive loggfilen selv, slik at det bare finnes én skriver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handling]
              properties:
                handling:
                  type: string
                  example: SAMTYKKE_OPPRETTET
                ressurs:
                  type: string
                sporingsId:
                  type: string
                aktor:
                  type: object
                  properties:
                    type:
                      type: string
                    id:
                      type: string
      responses:
        "201":
          description: Hendelsen er registrert
        "400":
          description: Hendelsen mangler handling

  /api/revisjonslogg/{sporingsId}:
    get:
      summary: Hent revisjonshendelsene for én flyt
      parameters:
        - name: sporingsId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hendelser returnert

components:
  parameters:
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        example: person-001

  schemas:
    SjekkResultat:
      type: object
      description: >
        Kontrakten et SJEKK-steg maa oppfylle. Er godkjent false, settes
        prosessoekten til AVVIST og melding blir avvistMelding.
        Se docs/prosessmodell.md.
      required: [godkjent, melding]
      properties:
        godkjent:
          type: boolean
        melding:
          type: string
        grunnlag:
          type: object
          description: Tallene bak utfallet, inkludert beregningsbeloep og terskel.
    ErrorResponse:
      type: object
      properties:
        feil:
          type: string
        tilgjengelige:
          type: array
          items:
            type: string
    MatrikkelGateSummary:
      type: object
      required: [gateId, adressenavn, kommune, antallEiendommer, antallBoligeiendommer]
      properties:
        gateId:
          type: string
        adressenavn:
          type: string
        kommune:
          type: string
        antallEiendommer:
          type: integer
        antallBoligeiendommer:
          type: integer
    MatrikkelEierforholdSjekk:
      type: object
      required: [personId, gate, harEiendom, godkjent]
      properties:
        personId:
          type: string
        gate:
          type: string
        harEiendom:
          type: boolean
        godkjent:
          type: boolean
    RedigeringMeta:
      type: object
      description: Valgfri metadata for enklere redigering av prosessdefinisjoner.
      additionalProperties: true
      properties:
        status:
          type: string
          description: For eksempel publisert eller template.
        mal:
          type: boolean
          description: Marker prosessen som mal i katalogen.
        eier:
          type: string
        hjelpetekst:
          type: string
    ProsessSteg:
      type: object
      additionalProperties: true
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
        tittel:
          type: string
        tekst:
          type: string
    ProsessDefinisjonInput:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        versjon:
          type: string
        redigering:
          $ref: "#/components/schemas/RedigeringMeta"
        steg:
          type: array
          items:
            $ref: "#/components/schemas/ProsessSteg"
    ProsessDefinisjon:
      allOf:
        - $ref: "#/components/schemas/ProsessDefinisjonInput"
        - type: object
          required: [id, navn, versjon, steg]
          properties:
            syntetisk:
              type: boolean

