openapi: 3.1.0
info:
  title: AI Gateway API
  version: 0.1.0
  description: Mock-API for dialogforslag, oppsummering og klarspråk.
servers:
  - url: http://localhost:8082
paths:
  /helse:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /ai/dialogforslag:
    post:
      summary: Generate mock dialog suggestion
      responses:
        "200":
          description: Suggestion returned
  /ai/oppsummering:
    post:
      summary: Generate mock summary
      responses:
        "200":
          description: Summary returned
  /ai/tolk-svar:
    post:
      summary: Interpret a short user reply into a structured intent
      responses:
        "200":
          description: Intent returned
