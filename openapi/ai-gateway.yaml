openapi: 3.1.0
info:
  title: AI Gateway API
  version: 0.2.0
  description: |
    AI-abstraksjonslag for dialogforslag, oppsummering, klarspråk, intensjonstolkning og dynamisk verktøyoppdagelse.
    Støtter mock, Ollama og OpenRouter som provider (AI_PROVIDER-env).
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Health check, inkludert om modellen faktisk er tilgjengelig
      description: |
        Svarer alltid 200 så lenge tjenesten kjører. Om modellen er nåbar leses
        av `modellNaaBar` — ikke av statuskoden. Er den `false`, faller
        `/ai/*` tilbake til maltekst med et `advarsel`-felt i svaret.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  tjeneste: { type: string, example: ai-gateway }
                  provider: { type: string, enum: [mock, ollama, openrouter] }
                  modell: { type: string, nullable: true, example: "ollama:qwen2.5:14b" }
                  modellNaaBar:
                    type: boolean
                    description: Om provideren svarer og modellen er lastet ned.
                  feil:
                    type: string
                    description: Kun til stede når modellNaaBar er false.
                    example: "Ollama kjoerer, men modellen qwen2.5:14b er ikke lastet ned"
                  tidspunkt: { type: string, format: date-time }
  /trace:
    get:
      summary: KI-spor som HTML — hva modellen faktisk fikk og svarte
      description: |
        Ett kall per linje, nyeste øverst, med full prompt og fullt svar før
        heuristikk og validering har vært innom. Sporet ligger i
        `state/ai-trace.jsonl` og nullstilles av `./start.sh --reset`.
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: sporingsId, schema: { type: string } }
        - { in: query, name: task, schema: { type: string } }
      responses:
        "200":
          description: HTML-visning
          content:
            text/html:
              schema: { type: string }
  /trace.json:
    get:
      summary: KI-spor som JSON
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: sporingsId, schema: { type: string } }
        - { in: query, name: task, schema: { type: string }, example: oppsummering }
      responses:
        "200":
          description: Sporlinjer, nyeste først
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  trace:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: { type: string, format: date-time }
                        sporingsId: { type: string, nullable: true }
                        task:
                          type: string
                          description: Endepunktet eller oppgavetypen kallet kom fra.
                          example: oppsummering
                        provider: { type: string }
                        model: { type: string, nullable: true }
                        temperature: { type: number }
                        prompt: { type: string }
                        response: { type: string, nullable: true }
                        durationMs: { type: integer }
                        failed: { type: boolean }
                        error: { type: string }
  /ai/dialogforslag:
    post:
      summary: Generer dialogforslag
      responses:
        "200":
          description: Forslag returnert
  /ai/oppsummering:
    post:
      summary: Lag oppsummering av prosessøktdata
      responses:
        "200":
          description: Oppsummering returnert
  /ai/forklar-databruk:
    post:
      summary: Forklar databruk i klarspråk
      responses:
        "200":
          description: Forklaring returnert
  /ai/klarsprak:
    post:
      summary: Omskriv tekst til klarspråk
      responses:
        "200":
          description: Klarspråk-versjon returnert
  /ai/risikosjekk:
    post:
      summary: Enkel risikovurdering
      responses:
        "200":
          description: Risikovurdering returnert
  /ai/tolk-svar:
    post:
      summary: Tolk en kort brukermelding til strukturert intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TolkSvarRequest"
      responses:
        "200":
          description: Intent returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TolkSvarResponse"
  /ai/velg-prosess:
    post:
      summary: Match fritekstmelding til mest sannsynlig prosess
      responses:
        "200":
          description: Prosessvalg returnert
  /ai/velg-verktoy:
    post:
      summary: Dynamisk verktøyoppdagelse – hvilke MCP-verktøy er relevante for et prosessteg?
      description: |
        Gitt et prosessteg (id, tittel, tekst, felter) og en liste over tilgjengelige verktøy,
        returnerer et rangert forslag med brukstype (kontekst, validering, kontekst_og_validering).
        Brukes av mcp-services/suggest_step_tools. Heuristikk-first, LLM-fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VelgVerktoyRequest"
      responses:
        "200":
          description: Verktøyforslag returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VelgVerktoyResponse"

components:
  schemas:
    TolkSvarRequest:
      type: object
      required: [tekst, jaIntent, neiIntent, ukjentIntent]
      properties:
        tekst:
          type: string
        jaIntent:
          type: string
        neiIntent:
          type: string
        ukjentIntent:
          type: string
        kontekst:
          type: object
          additionalProperties: true
        sporingsId:
          type: string
    TolkSvarResponse:
      type: object
      required: [intent, confidence]
      properties:
        intent:
          type: string
        confidence:
          type: number
        begrunnelse:
          type: string
        modell:
          type: string
        syntetisk:
          type: boolean
    VelgVerktoyRequest:
      type: object
      required: [steg]
      properties:
        steg:
          type: object
          properties:
            id:
              type: string
            tittel:
              type: string
            tekst:
              type: string
            felter:
              type: array
              items:
                type: object
        verktoy:
          type: array
          description: Tilgjengelige verktøy med navn og beskrivelse
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
        sporingsId:
          type: string
    VelgVerktoyForslag:
      type: object
      required: [name, bruk]
      properties:
        name:
          type: string
        bruk:
          type: string
          enum: [kontekst, validering, kontekst_og_validering]
        begrunnelse:
          type: string
    VelgVerktoyResponse:
      type: object
      required: [verktoy, modell]
      properties:
        verktoy:
          type: array
          items:
            $ref: "#/components/schemas/VelgVerktoyForslag"
        modell:
          type: string
        syntetisk:
          type: boolean
        advarsel:
          type: string
