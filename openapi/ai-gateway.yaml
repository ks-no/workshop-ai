openapi: 3.1.0
info:
  title: AI Gateway API
  version: 0.2.0
  description: |
    AI-abstraksjonslag for dialogforslag, oppsummering, klarspråk, intensjonstolkning og dynamisk verktøyoppdagelse.
    Støtter mock, Ollama, OpenRouter og AWS Bedrock som provider (AI_PROVIDER-env).
    Provideren kan byttes i en kjørende instans via /admin, uten restart.
servers:
  - url: http://localhost:8082
# Ingen av rutene her krever token, og det er et valg, ikke en glipp.
# ai-gateway er en intern tjeneste i sandkassen: den kalles av sandbox-backend og demo-GUI-ene, og henter selv et Maskinporten-token når den skriver til revisjonsloggen. Innkommende kall verifiseres ikke.
# En tom security på dokumentnivå gjelder alle operasjonene under paths.
security: []

paths:
  /helse:
    get:
      summary: Health check, inkludert om modellen faktisk er tilgjengelig
      description: |
        Svarer alltid 200 så lenge tjenesten kjører. Om modellen er nåbar leses
        av `modellNaaBar` — ikke av statuskoden. Er den `false`, faller
        `/ai/*` tilbake til maltekst med et `advarsel`-felt i svaret.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  tjeneste: { type: string, example: ai-gateway }
                  provider: { type: string, enum: [mock, ollama, openrouter, bedrock] }
                  modell: { type: string, nullable: true, example: "ollama:qwen2.5:14b" }
                  modellNaaBar:
                    type: boolean
                    description: Om provideren svarer og modellen er lastet ned.
                  feil:
                    type: string
                    description: Kun til stede når modellNaaBar er false.
                    example: "Ollama kjoerer, men modellen qwen2.5:14b er ikke lastet ned"
                  tidspunkt: { type: string, format: date-time }
  /openapi-ruter.json:
    get:
      summary: Spesifikasjonen lest, som JSON
      security: []
      description: >
        Den samme spesifikasjonen som /openapi.yaml, lest av
        apps/shared-ui/openapi.ts: én oppføring per operasjon, med sammendrag,
        hjemmel og parametere. Finnes fordi en nettleser ikke kan lese YAML uten en
        parser, og sandkassen har ingen. Dette er kilden API-utforskeren på
        http://localhost:3001/utforsker rendrer.
      responses:
        "200":
          description: Ruteoversikten
          content:
            application/json:
              schema:
                type: object
                properties:
                  tjeneste: { type: string }
                  beskrivelse: { type: string }
                  server: { type: string }
                  ruter:
                    type: array
                    items:
                      type: object
                      properties:
                        sti: { type: string }
                        metode: { type: string }
                        linje: { type: integer }
                        sammendrag: { type: string }
                        beskrivelse: { type: string }
                        security:
                          type: array
                          items: { type: string }
                          description: Ordningene ruta godtar. Tom liste betyr åpen.
                        scopes:
                          type: array
                          items: { type: string }
                        parametere:
                          type: array
                          items:
                            type: object
                            properties:
                              navn: { type: string }
                              plassering: { type: string }
                              paakrevd: { type: boolean }
                              eksempel: { type: string }
                              beskrivelse: { type: string }
                        kroppEksempel: { type: string }
  /trace:
    get:
      summary: KI-spor som HTML — hva modellen faktisk fikk og svarte
      description: |
        Ett kall per linje, nyeste øverst, med full prompt og fullt svar før
        heuristikk og validering har vært innom. Sporet ligger i
        `state/ai-trace.jsonl` og nullstilles av `./start.sh --reset`.
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: sporingsId, schema: { type: string } }
        - { in: query, name: task, schema: { type: string } }
      responses:
        "200":
          description: HTML-visning
          content:
            text/html:
              schema: { type: string }
  /trace.json:
    get:
      summary: KI-spor som JSON
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: sporingsId, schema: { type: string } }
        - { in: query, name: task, schema: { type: string }, example: oppsummering }
      responses:
        "200":
          description: Sporlinjer, nyeste først
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  trace:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: { type: string, format: date-time }
                        sporingsId: { type: string, nullable: true }
                        task:
                          type: string
                          description: Endepunktet eller oppgavetypen kallet kom fra.
                          example: oppsummering
                        provider: { type: string }
                        model: { type: string, nullable: true }
                        temperature: { type: number }
                        prompt: { type: string }
                        response: { type: string, nullable: true }
                        durationMs: { type: integer }
                        failed: { type: boolean }
                        error: { type: string }
  /admin:
    get:
      summary: Provider-bytte, som en side
      description: |
        HTML-side som viser aktiv provider og lar deg bytte mellom
        mock/ollama/openrouter/bedrock (og Bedrock-modell) uten restart.
        Henter status fra /admin/providers.json og bytter via POST /admin/provider.
      responses:
        "200":
          description: HTML-visning
          content:
            text/html:
              schema: { type: string }
  /admin/providers.json:
    get:
      summary: Aktiv provider og tilgjengelige valg
      responses:
        "200":
          description: Status returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /admin/provider:
    post:
      summary: Bytt aktiv provider (og for Bedrock, modell) uten restart
      description: |
        Lagres til state/ai-provider-override.json, som overstyrer AI_PROVIDER/
        BEDROCK_MODEL_ID fra miljøet ved neste oppstart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [mock, ollama, openrouter, bedrock] }
                bedrockModel:
                  type: string
                  description: Må finnes i AdminStatus.bedrock.models. Brukes bare når provider=bedrock.
      responses:
        "200":
          description: Byttet. Ny status returnert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "400":
          description: Ukjent provider eller ukjent Bedrock-modell
  /ai/dialogforslag:
    post:
      summary: Generer dialogforslag
      responses:
        "200":
          description: Forslag returnert
  /ai/oppsummering:
    post:
      summary: Lag oppsummering av prosessøktdata
      responses:
        "200":
          description: Oppsummering returnert
  /ai/forklar-databruk:
    post:
      summary: Forklar databruk i klarspråk
      responses:
        "200":
          description: Forklaring returnert
  /ai/klarsprak:
    post:
      summary: Omskriv tekst til klarspråk
      responses:
        "200":
          description: Klarspråk-versjon returnert
  /ai/risikosjekk:
    post:
      summary: Enkel risikovurdering
      responses:
        "200":
          description: Risikovurdering returnert
  /ai/sporsmaal:
    post:
      summary: Svar på et fritt spørsmål fra innbygger, midt i en prosessflyt
      description: >-
        Besvarer et fritt spørsmål ut fra grunnlaget kalleren sender med — satser,
        prosessdefinisjonen, hvor i flyten økten står, og det økten allerede har
        hentet. Endepunktet har ingen dataadgang av seg selv: det slår ingenting
        opp og kaller ikke sandbox-backend for data, og kan derfor ikke omgå
        samtykkesperren i `utforRessurs()`.


        Sperrer kjøres i kode etter modellkallet, ikke bare i prompten: svar som
        avgjør saken, oppgir beløp som ikke finnes i grunnlaget, påstår at noe er
        utført som ikke er det, eller gjengir fødselsnummer, erstattes av et trygt
        standardsvar. Prompt injection og personvernspørsmål avvises eller besvares
        uten å spørre modellen i det hele tatt. Slår en sperre inn, settes `sperre`
        og `advarsel`, og `modell` får suffikset `(sperret)` slik at KI-sporet
        fortsatt viser hva modellen faktisk sa.


        Merk at `tekst` ligger på toppnivå her, som i `/ai/tolk-svar` — ikke under
        `kontekst`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SporsmaalRequest"
      responses:
        "200":
          description: Svar returnert, eventuelt erstattet av en sperre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SporsmaalResponse"
  /ai/tolk-svar:
    post:
      summary: Tolk en kort brukermelding til strukturert intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TolkSvarRequest"
      responses:
        "200":
          description: Intent returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TolkSvarResponse"
  /ai/velg-prosess:
    post:
      summary: Match fritekstmelding til mest sannsynlig prosess
      responses:
        "200":
          description: Prosessvalg returnert
  /ai/dommer:
    post:
      summary: LLM-as-judge — scorer en tekst mot et kriterium
      description: |
        Utviklerverktøy for `scripts/eval.ts`. Ligger her og ikke i eval-skriptet,
        så den bruker konfigurert provider, arver timeouten og spores som `task: dommer`.
        Dommeren ser bare kriteriet og teksten, aldri forventet svar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kriterium, tekst]
              properties:
                kriterium: { type: string, example: "Alle beløp er gjengitt nøyaktig." }
                tekst: { type: string }
                sporingsId: { type: string }
      responses:
        "200":
          description: Score returnert
          content:
            application/json:
              schema:
                type: object
                properties:
                  score: { type: number, minimum: 0, maximum: 1 }
                  begrunnelse: { type: string }
                  modell: { type: string }
                  syntetisk: { type: boolean }
        "400":
          description: kriterium eller tekst mangler
  /ai/velg-verktoy:
    post:
      summary: Dynamisk verktøyoppdagelse – hvilke MCP-verktøy er relevante for et prosessteg?
      description: |
        Gitt et prosessteg (id, tittel, tekst, felter) og en liste over tilgjengelige verktøy,
        returnerer et rangert forslag med brukstype (kontekst, validering, kontekst_og_validering).
        Brukes av tools-api/suggest_step_tools. Heuristikk-first, LLM-fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VelgVerktoyRequest"
      responses:
        "200":
          description: Verktøyforslag returnert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VelgVerktoyResponse"

  /docs:
    get:
      summary: Ruteoversikt som HTML
      responses:
        "200":
          description: HTML-side
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: Denne spesifikasjonen
      responses:
        "200":
          description: OpenAPI-dokumentet
          content:
            text/yaml:
              schema:
                type: string

components:
  schemas:
    AdminStatus:
      type: object
      required: [provider, providers, modellNaaBar]
      properties:
        provider: { type: string, enum: [mock, ollama, openrouter, bedrock] }
        providers:
          type: array
          items: { type: string }
        modell: { type: string, nullable: true }
        modellNaaBar: { type: boolean }
        feil: { type: string }
        bedrock:
          type: object
          properties:
            models:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, example: "anthropic.claude-3-5-sonnet-20241022-v2:0" }
                  label: { type: string, example: "Claude 3.5 Sonnet v2" }
            currentModel: { type: string }
            region: { type: string }
            credsConfigured: { type: boolean }
        ollama:
          type: object
          properties:
            model: { type: string }
            baseUrl: { type: string }
        openrouter:
          type: object
          properties:
            model: { type: string }
            keyConfigured: { type: boolean }
    SporsmaalRequest:
      type: object
      required: [tekst]
      properties:
        tekst:
          type: string
          description: Innbyggerens spørsmål, ordrett. Behandles som data, aldri som instruksjoner.
          example: hvorfor trenger dere skattedataene mine?
        sprak:
          type: string
          default: nb
        sporingsId:
          type: string
        kontekst:
          type: object
          description: >-
            Grunnlaget svaret skal bygge på. Alt utenfor hvitelisten strippes bort
            før prompten bygges, så fødselsnummer, navn og inntektsposter fra økten
            når aldri modellen.
          properties:
            tjeneste:
              type: string
            satser:
              type: object
              description: Svaret på `GET /api/regler/satser`. Uten den avvises spørsmål om satser og inntektsgrenser.
              additionalProperties: true
            prosess:
              type: object
              description: Prosessdefinisjonen. Bare id, type, tittel, formaal og dataKilder per steg beholdes.
              additionalProperties: true
            steg:
              type: object
              additionalProperties: true
            flyt:
              type: object
              description: >-
                Hvor økten faktisk står. Uten denne leser modellen stegnavnet
                «Send søknad» i prosessdefinisjonen og rapporterer det som utført.
              properties:
                staarPaa:
                  type: string
                stegNummer:
                  type: integer
                avTotalt:
                  type: integer
                status:
                  type: string
                fullforteSteg:
                  type: array
                  items:
                    type: string
                gjenstaaendeSteg:
                  type: array
                  items:
                    type: string
                soknadSendt:
                  type: boolean
                  description: Alt annet enn `true` tolkes som ikke sendt.
            samtykke:
              type: object
              properties:
                status:
                  type: string
                formaal:
                  type: string
                dataKilder:
                  type: array
                  items:
                    type: string
            resultater:
              type: object
              description: Resultater per steg. Bare godkjent, melding, grunnlag, tekst og status beholdes.
              additionalProperties: true
            samtale:
              type: array
              description: Siste turer i samtalen, så oppfølgingsspørsmål virker. Kappes til seks.
              items:
                type: object
                properties:
                  rolle:
                    type: string
                    enum: [innbygger, assistent]
                  tekst:
                    type: string
    SporsmaalResponse:
      type: object
      required: [tekst, grunnlag, modell, syntetisk]
      properties:
        tekst:
          type: string
        grunnlag:
          type: object
          description: Hvilke kilder svaret bygger på. Vises for innbygger i referanse-GUI-et.
          properties:
            kilder:
              type: array
              items:
                type: string
            verdier:
              type: object
              additionalProperties: true
        modell:
          type: string
          description: >-
            Modell-id, `fast-tekst` for personvernsvar, `sperre` når spørsmålet ble
            avvist uten modellkall, eller modell-id med suffikset `(sperret)` når
            svaret ble erstattet etter kallet.
        sperre:
          type: string
          description: Satt bare når en sperre slo inn.
          enum:
            - injeksjon
            - tomt-sporsmaal
            - manglende-grunnlag
            - beslutning
            - ikke-utfort
            - tall
            - identifikator
            - promptlekkasje
            - lengde
            - tomt
        advarsel:
          type: string
        syntetisk:
          type: boolean
        sprak:
          type: string
    TolkSvarRequest:
      type: object
      required: [tekst, jaIntent, neiIntent, ukjentIntent]
      properties:
        tekst:
          type: string
        jaIntent:
          type: string
        neiIntent:
          type: string
        ukjentIntent:
          type: string
        kontekst:
          type: object
          additionalProperties: true
        sporingsId:
          type: string
    TolkSvarResponse:
      type: object
      required: [intent, confidence]
      properties:
        intent:
          type: string
        confidence:
          type: number
        begrunnelse:
          type: string
        modell:
          type: string
        syntetisk:
          type: boolean
    VelgVerktoyRequest:
      type: object
      required: [steg]
      properties:
        steg:
          type: object
          properties:
            id:
              type: string
            tittel:
              type: string
            tekst:
              type: string
            felter:
              type: array
              items:
                type: object
        verktoy:
          type: array
          description: Tilgjengelige verktøy med navn og beskrivelse
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
        sporingsId:
          type: string
    VelgVerktoyForslag:
      type: object
      required: [name, bruk]
      properties:
        name:
          type: string
        bruk:
          type: string
          enum: [kontekst, validering, kontekst_og_validering]
        begrunnelse:
          type: string
    VelgVerktoyResponse:
      type: object
      required: [verktoy, modell]
      properties:
        verktoy:
          type: array
          items:
            $ref: "#/components/schemas/VelgVerktoyForslag"
        modell:
          type: string
        syntetisk:
          type: boolean
        advarsel:
          type: string
