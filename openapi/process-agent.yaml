openapi: 3.1.0
info:
  title: Process Agent API
  version: 0.1.0
  description: Generic process guide agent powered by the tools-api endpoints.
servers:
  - url: http://localhost:8084
# Ingen av rutene her krever token, og det er et valg, ikke en glipp.
# process-agent er en intern orkestrator som kaller tools-api og ai-gateway. Den verifiserer ingen innkommende token, og har ingen egen ressurs å beskytte.
# En tom security på dokumentnivå gjelder alle operasjonene under paths.
security: []

paths:
  /helse:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /docs:
    get:
      summary: Ruteoversikt som HTML
      security: []
      description: >
        Generert av spesifikasjonen, ikke skrevet for hånd: en håndskrevet liste er
        en tredje sannhet ved siden av koden og filen, og den driver i stillhet.
      responses:
        "200":
          description: HTML-side
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: Denne spesifikasjonen
      security: []
      description: >
        Tjenesten serverer sin egen spesifikasjon fra openapi/. Filen og koden
        holdes i takt av scripts/sjekk-openapi-dekning.ts.
      responses:
        "200":
          description: OpenAPI-dokumentet
          content:
            text/yaml:
              schema:
                type: string
  /openapi-ruter.json:
    get:
      summary: Spesifikasjonen lest, som JSON
      security: []
      description: >
        Den samme spesifikasjonen som /openapi.yaml, lest av
        apps/shared-ui/openapi.ts: én oppføring per operasjon, med sammendrag,
        hjemmel og parametere. Finnes fordi en nettleser ikke kan lese YAML uten en
        parser, og sandkassen har ingen. Dette er kilden API-utforskeren på
        http://localhost:3001/utforsker rendrer.
      responses:
        "200":
          description: Ruteoversikten
          content:
            application/json:
              schema:
                type: object
                properties:
                  tjeneste: { type: string }
                  beskrivelse: { type: string }
                  server: { type: string }
                  ruter:
                    type: array
                    items:
                      type: object
                      properties:
                        sti: { type: string }
                        metode: { type: string }
                        linje: { type: integer }
                        sammendrag: { type: string }
                        beskrivelse: { type: string }
                        security:
                          type: array
                          items: { type: string }
                          description: Ordningene ruta godtar. Tom liste betyr åpen.
                        scopes:
                          type: array
                          items: { type: string }
                        parametere:
                          type: array
                          items:
                            type: object
                            properties:
                              navn: { type: string }
                              plassering: { type: string }
                              paakrevd: { type: boolean }
                              eksempel: { type: string }
                              beskrivelse: { type: string }
                        kroppEksempel: { type: string }
  /agent/sessions:
    post:
      summary: Create an agent session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
  /agent/sessions/{sessionId}:
    get:
      summary: Get session status
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStateResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
  /agent/sessions/{sessionId}/messages:
    post:
      summary: Send message to agent
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Agent replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, tjeneste, tidspunkt]
      properties:
        status:
          type: string
          example: ok
        tjeneste:
          type: string
          example: process-agent
        tidspunkt:
          type: string
          format: date-time
    AgentError:
      type: object
      required: [feil]
      properties:
        feil:
          type: string
        detalj:
          type: string
    ProcessSummary:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        antallSteg:
          type: integer
    CreateSessionRequest:
      type: object
      additionalProperties: true
      properties:
        personId:
          type: string
          description: Optional. Defaults to person-001.
    CreateSessionResponse:
      type: object
      required: [sessionId, personId, message]
      properties:
        sessionId:
          type: string
        personId:
          type: string
        message:
          type: string
          description: Initial prompt listing available processes.
    SessionStateResponse:
      type: object
      required: [sessionId, personId, awaiting, created, updated]
      properties:
        sessionId:
          type: string
        personId:
          type: string
        selectedProcess:
          oneOf:
            - $ref: "#/components/schemas/ProcessSummary"
            - type: "null"
        pendingProcessCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSummary"
        oektsId:
          oneOf:
            - type: string
            - type: "null"
        sporingsId:
          oneOf:
            - type: string
            - type: "null"
        awaiting:
          oneOf:
            - type: string
            - type: "null"
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          description: User message for the current session state.
    SendMessageResponse:
      type: object
      required: [sessionId, replies, awaiting]
      properties:
        sessionId:
          type: string
        replies:
          type: array
          items:
            type: string
        awaiting:
          oneOf:
            - type: string
            - type: "null"
        selectedProcess:
          oneOf:
            - $ref: "#/components/schemas/ProcessSummary"
            - type: "null"
        pendingProcessCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSummary"
        oektsId:
          oneOf:
            - type: string
            - type: "null"
        sporingsId:
          oneOf:
            - type: string
            - type: "null"

