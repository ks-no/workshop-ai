  /register/api/v1/ks/{rolleId}/skatteoginntektsopplysninger/beregning/langtidsopphold-institusjon:
    post:
      summary: Beregn inntektsgrunnlag for langtidsopphold i institusjon
      description: >
        Simulerer KS Fiks sitt register-API, beregningstype
        LANGTIDSOPPHOLD_INSTITUSJON. Samme stifamilie, kropp og svarform som
        redusert foreldrebetaling; forskjellene er `beregningstype`-verdien,
        persontypene (SOEKER, EKTEFELLE, PARTNER, SAMBOER, BARN) og at
        visningspostene i tillegg får kategorien FRADRAG, bygget av postene
        med `medregnes: false` og utelatt når den er tom. Stien og modellen
        følger
        https://developers.fiks.ks.no/api/register-skatteoginntektsopplysninger-beregning-api-v1.json

        Avvik fra det ekte API-et: `/pdf`-variantene og den generiske
        `/beregning`-ruta er ikke implementert.
      security:
        - maskinporten: [ks:fiks:register]
      parameters:
        - name: rolleId
          in: path
          required: true
          description: Kommunens rolle-id. Simulatoren aksepterer enhver verdi.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inntektsaar, personer]
              properties:
                inntektsaar:
                  type: integer
                  example: 2025
                personer:
                  type: array
                  items:
                    type: object
                    required: [identifikator, type]
                    properties:
                      identifikator:
                        type: string
                        pattern: "^[0-9]{11}$"
                      type:
                        type: string
                        enum: [SOEKER, EKTEFELLE, PARTNER, SAMBOER, BARN]
                      ekstraposter:
                        type: array
                        description: Inntekt innbyggeren oppgir selv. Får kilde MANUELL_INPUT.
                        items:
                          type: object
                          required: [tekniskNavn, beloep]
                          properties:
                            tekniskNavn:
                              type: string
                            visningstekst:
                              type: string
                            beloep:
                              type: integer
                              format: int64
                            referanse:
                              type: string
      responses:
        "200":
          description: Beregning utfoert
          content:
            application/json:
              schema:
                type: object
                properties:
                  inntektsaar:
                    type: integer
                  stadie:
                    type: string
                    enum: [OPPGJOER, UTKAST, UKJENT]
                  personer:
                    type: array
                    items:
                      type: object
                      properties:
                        identifikator:
                          type: string
                        navn:
                          type: object
                          properties:
                            fornavn:
                              type: string
                            mellomnavn:
                              type: string
                            etternavn:
                              type: string
                        type:
                          type: string
                        skjermet:
                          type: boolean
                        skatteoppgjoersdato:
                          type: string
                          format: date
                        stadie:
                          type: string
                  visningsposter:
                    type: array
                    description: >-
                      Presentasjonsvennlig oppstilling per inntektstype. Enumen
                      er spekkens fulle kategorisett, men de syntetiske dataene
                      har ingen formue- eller gjeldsposter, så FORMUE, GJELD og
                      ANNET forekommer aldri i sandkassen. FRADRAG bygges av
                      postene med `medregnes: false` og utelates når den er tom.
                    items:
                      type: object
                      properties:
                        kategori:
                          type: string
                          enum: [INNTEKT, FRADRAG, FORMUE, GJELD, ANNET]
                        poster:
                          type: array
                          items:
                            type: object
                  beregningsbeloep:
                    type: integer
                    format: int64
                    description: Grunnlaget etter fradrag. Dette er tallet regelsjekken bruker.
                  inntekt:
                    type: object
                    description: Grupper med operasjon ADDERE.
                  fradrag:
                    type: object
                    description: Ytelser som ikke inngaar i grunnlaget, med operasjon SUBTRAHERE.
                  beregningstype:
                    type: string
                    enum: [LANGTIDSOPPHOLD_INSTITUSJON]
                  feilmeldinger:
                    type: array
                    items:
                      type: object
                      properties:
                        kode:
                          type: string
                        melding:
                          type: string
  /register/api/v1/ks/{rolleId}/krr/person:
    post:
      summary: Slå opp en person i Fiks Kontaktregisteret (KRR)
      description: >
        Simulerer KS Fiks Kontaktregisteret: kan personen varsles digitalt, er
        de reservert, og hvilken målform foretrekker de. Oppslaget er en POST
        med fødselsnummeret i kroppen, som i det ekte API-et — et fnr i URL-en
        ville havnet i alle aksessloggene på veien. Stien og svarmodellen
        (`KrrDefinisjon`) følger
        https://developers.fiks.ks.no/api/register-krr-api-v1.json

        Registeret dekker bosatte på 15 år eller mer — KRRs reelle aldersgrense.
        Feilskillet er del av læringsverdien: 400 `UGYLDIG_IDENTIFIKATOR` for et
        misdannet fnr, 404 `PERSON_IKKE_FUNNET` for et ukjent, og 404
        `IKKE_I_KONTAKTREGISTERET` for en kjent person under 15 år eller som
        ikke er bosatt. Adressebeskyttede personer (kode 6/7) får `epost` og
        `tlf` nullet i svaret; `reservert`, `spraak` og `kanVarsles` beholdes.

        Avvik fra det ekte API-et: `spraak` finnes ikke i Fiks-KRR-spekken — det
        er lånt fra Digdirs underliggende KRR fordi språkvalg er et reelt
        kommunalt behov. Og fnr valideres med modulus 11, strengere enn spekkens
        `^[0-9]{11}$`.
      security:
        - maskinporten: [ks:fiks:register]
      parameters:
        - name: rolleId
          in: path
          required: true
          description: Kommunens rolle-id. Simulatoren aksepterer enhver verdi.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fnr]
              properties:
                fnr:
                  type: string
                  pattern: "^[0-9]{11}$"
                  description: Syntetisk fødselsnummer. Valideres med modulus 11.
      responses:
        "200":
          description: Personen står i kontaktregisteret
          content:
            application/json:
              schema:
                type: object
                properties:
                  fnr:
                    type: string
                  epost:
                    type: object
                    nullable: true
                    description: Null når personen ikke har registrert e-post, og for adressebeskyttede.
                    properties:
                      adresse:
                        type: string
                      sistOppdatert:
                        type: string
                        format: date
                      sistVerifisert:
                        type: string
                        format: date
                  tlf:
                    type: object
                    nullable: true
                    description: Null når personen ikke har registrert telefon, og for adressebeskyttede.
                    properties:
                      nummer:
                        type: string
                      sistOppdatert:
                        type: string
                        format: date
                      sistVerifisert:
                        type: string
                        format: date
                  status:
                    type: string
                    enum: [AKTIV]
                  reservert:
                    type: boolean
                    description: Reservasjon mot digital kommunikasjon.
                  kanVarsles:
                    type: boolean
                    description: Utledet — ikke reservert, og har e-post eller telefon.
                  spraak:
                    type: string
                    enum: [nb, nn, en]
                    description: Målform. Flagget avvik — feltet er lånt fra Digdirs KRR.
                  syntetisk:
                    type: boolean
        "400":
          description: Misdannet fødselsnummer (`UGYLDIG_IDENTIFIKATOR`)
        "404":
          description: >-
            Ukjent fnr (`PERSON_IKKE_FUNNET`), eller kjent person under 15 år /
            ikke bosatt (`IKKE_I_KONTAKTREGISTERET`)
  /folkeregister/api/v1/{rolleId}/v1/personer/{fnr}:
    get:
      summary: Folkeregisteroppslag i en rollekontekst
      description: |-
        Simulerer Fiks Folkeregister på den eksakte proxystien — den doble
        versjonen er ikke en skrivefeil: `/api/v1/` er Fiks-proxyens, `/v1/` er
        FREGs egen. Alle kall skjer i en rollekontekst som avgrenser lovhjemmel
        og hvilke informasjonsdeler man får ut. Det er flatens poeng:
        dataminimering som API-adferd, ikke som prosatekst.

        Tre faste roller (lukket kart, se apps/fiks-simulator/src/folkeregister.ts):

        | rolleId | Rolle | Informasjonsdeler |
        |---|---|---|
        | `3fa85f64-5717-4562-b3fc-2c963f66afa6` | oppvekst | personnavn, foedselsdato, kjoenn, personstatus, doedsfall, bostedsadresse, adressebeskyttelse, forelderbarnrelasjon, familierelasjon, foreldreansvar |
        | `5e7a0500-91d6-4519-a898-3dbb4bfc8a61` | helse-omsorg | personnavn, foedselsdato, personstatus, doedsfall, bostedsadresse, kontaktadresse, sivilstand, adressebeskyttelse, familierelasjon |
        | `09b21eb2-c0cb-4a87-9cb0-f5405040faa3` | folkehelse | foedselsdato, kjoenn, personstatus — verken navn eller adresse |

        `?part=` snevrer inn innenfor rollen og kan gjentas. Avslagene bærer
        læringen: en del utenfor rollen er 403 `UTENFOR_ROLLE`, ikke et tomt
        felt — å be om mer enn hjemmelen gir er et avslag. Ukjent del er 400
        `UKJENT_INFORMASJONSDEL`, ukjent rolleId 403 `UKJENT_ROLLE` med de
        gyldige rollene i meldingen. Adressebeskyttede maskeres på vei ut
        (apps/shared/skjerming.ts, `maskFregPerson`): FORTROLIG nuller
        adressefelter og kontakt, STRENGT_FORTROLIG i tillegg personnavn;
        `adressebeskyttelse` overlever alltid. Oppslaget revisjonslogges med
        rolle og deler i grunnlaget.

        Avvik fra det ekte API-et: FREG returnerer informasjonselementer som
        lister med ajourholdsmetadata — simulatoren serverer seedens flate
        form. Rollene er tre faste eksempler, mot ekte FREG der rollene
        konfigureres per virksomhet. Kun enkeltoppslag — ingen
        `sok`/`uttrekk`/`bulk`. Og fnr valideres med modulus 11, strengere enn
        spekkens regex. Sandkasse-interne felter (`_sandbox*`) og
        Tenor-ekstrafelter er strippet fra svaret.
      security:
        - maskinporten: [ks:fiks:folkeregister]
      parameters:
        - name: rolleId
          in: path
          required: true
          description: Rollekonteksten oppslaget skjer i. Én av de tre faste rollene.
          schema:
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        - name: fnr
          in: path
          required: true
          description: Syntetisk fødselsnummer. Valideres med modulus 11.
          schema:
            type: string
            pattern: "^[0-9]{11}$"
          example: "12818800078"
        - name: part
          in: query
          required: false
          description: >-
            Informasjonsdel som skal med i svaret. Kan gjentas
            (`?part=a&part=b`). Uten `part` svares alle delene rollen gir. En
            del utenfor rollen er 403.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Informasjonsdel"
      responses:
        "200":
          description: >-
            De forespurte informasjonsdelene, i fast rekkefølge. Hver forespurt
            del er med, som null når registeret ikke har noe — en utelatt
            nøkkel ville gjort «ikke spurt om» og «tomt» like på tråden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  foedselsEllerDNummer:
                    type: string
                  personnavn:
                    type: object
                    nullable: true
                    properties:
                      fornavn:
                        type: string
                      mellomnavn:
                        type: string
                        nullable: true
                      etternavn:
                        type: string
                  foedselsdato:
                    type: string
                    format: date
                  kjoenn:
                    type: string
                    enum: [KVINNE, MANN]
                  personstatus:
                    type: string
                    enum: [BOSATT, UTFLYTTET, DOED, INAKTIV, MIDLERTIDIG, OPPHOERT, FORSVUNNET]
                  doedsfall:
                    type: object
                    nullable: true
                    properties:
                      doedsdato:
                        type: string
                        format: date
                  sivilstand:
                    type: string
                    nullable: true
                  bostedsadresse:
                    type: object
                    nullable: true
                    description: >-
                      Seedens flate form, ikke FREGs vegadresse-struktur.
                      Adressefeltene nulles for adressebeskyttede; kommune og
                      kommunenummer overlever, som i resten av sandkassen.
                  kontaktadresse:
                    type: object
                    nullable: true
                  forelderbarnrelasjon:
                    type: array
                    nullable: true
                    description: >-
                      Skatteetatens feltnavn, uten binde-e — en annen frossen
                      kontraktsnøkkel enn personer-datasettets
                      foreldrebarnrelasjon, med vilje ikke forent.
                    items:
                      type: object
                      properties:
                        relatertPersonsIdent:
                          type: string
                          nullable: true
                        relatertPersonsRolle:
                          type: string
                  familierelasjon:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        relatertPersonsIdent:
                          type: string
                          nullable: true
                        relatertPersonsRolle:
                          type: string
                        minRolleForPerson:
                          type: string
                  foreldreansvar:
                    type: string
                    nullable: true
                  adressebeskyttelse:
                    type: string
                    enum: [UGRADERT, FORTROLIG, STRENGT_FORTROLIG]
                  syntetisk:
                    type: boolean
        "400":
          description: >-
            Misdannet fødselsnummer (`UGYLDIG_IDENTIFIKATOR`), eller en
            informasjonsdel som ikke finnes (`UKJENT_INFORMASJONSDEL`)
        "403":
          description: >-
            Ukjent rolleId (`UKJENT_ROLLE`, med de gyldige rollene i
            meldingen), en informasjonsdel utenfor rollens hjemmel
            (`UTENFOR_ROLLE`), eller manglende hjemmel som på de andre flatene
        "404":
          description: Ukjent fnr (`PERSON_IKKE_FUNNET`)
        "401":
          $ref: "#/components/responses/ManglerToken"
components:
  parameters:
    SamtykkeId:
      name: samtykkeId
      in: path
      required: true
      schema:
        type: string
      example: samtykke-1787295292530-ddxjgm
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
      example: person-001
    OppgaveId:
      name: oppgaveId
      in: path
      required: true
      schema:
        type: string

  responses:
    IkkeFunnet:
      description: Fant ikke ressursen
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"
    UkjentStatus:
      description: >-
        Statusen finnes ikke i kodeverket. En feilformet forespørsel, ikke en
        konflikt — derfor 400 og ikke 409.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"
    UgyldigOvergang:
      description: >-
        Statusen finnes, men kan ikke nås fra den ressursen har nå. Meldingen
        sier hva statusen var og hva som ble forsøkt.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"
    ManglerToken:
      description: >-
        Ingen eller ugyldig Authorization-header. `WWW-Authenticate` bærer koden;
        prosaen ligger i kroppen, fordi RFC 6750 ikke tar norsk tekst i en header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"
    ManglerHjemmel:
      description: >-
        Tokenet er gyldig, men gir ikke hjemmel her: manglende scope, eller et
        personlig ID-porten-token mot en maskin-til-maskin-flate. Forskjellen på
        401 og 403 er forskjellen på «vi vet ikke hvem du er» og «vi vet, og du
        har ikke lov».
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Feil"

  schemas:
    Feil:
      type: object
      properties:
        feil:
          type: string
          description: Meldingen, på norsk, til den som kalte.
        feilmeldinger:
          type: array
          description: Fiks' egen feilform, med en maskinlesbar kode ved siden av meldingen.
          items:
            type: object
            properties:
              kode:
                type: string
                enum:
                  - MANGLER_TOKEN
                  - UGYLDIG_TOKEN
                  - UTSTEDER_NEDE
                  - KREVER_MASKINPORTEN
                  - MANGLER_SCOPE
                  - SAMTYKKE_IKKE_FUNNET
                  - OPPGAVE_IKKE_FUNNET
                  - UKJENT_STATUS
                  - UGYLDIG_OVERGANG
              melding:
                type: string
        syntetisk:
          type: boolean

    Aktor:
      type: object
      description: >-
        Hvem som handlet. Oppgis av kalleren for innbyggerens egne handlinger,
        fordi bare kalleren kjenner den verifiserte identiteten — sandbox-backend
        henter den fra tokenet sitt. Uten oppgitt aktør sier loggen det som er
        sant: fiks-simulator førte det, på vegne av noen.
      properties:
        type:
          type: string
          enum: [innbygger, system]
        id:
          type: string
        acr:
          type: string
        paaVegneAv:
          type: string

    Samtykkestatus:
      type: string
      description: >-
        Kodeverket ligger i apps/shared/samtykke.ts, og
        scripts/valider-data.ts feiler hvis informasjonsmodellen kommer ut av
        takt med det. `IKKE_SAMTYKKET`, `TRUKKET` og `UTLOEPT` er endelige.
        `UTLOEPT` utledes av `utloper` og skrives aldri til rad.
      enum: [VENTER_PAA_SVAR, SAMTYKKET, IKKE_SAMTYKKET, TRUKKET, UTLOEPT]

    Samtykkehendelse:
      type: object
      properties:
        tidspunkt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/Samtykkestatus"

    Samtykke:
      type: object
      properties:
        samtykkeId:
          type: string
        personId:
          type: string
        formaal:
          type: string
        dataKilder:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/Samtykkestatus"
        opprettet:
          type: string
          format: date-time
        utloper:
          type: string
          format: date-time
          description: 30 dager etter opprettelsen. Etter dette hjemler samtykket ingen lesning.
        sporingsId:
          type: string
        historikk:
          type: array
          items:
            $ref: "#/components/schemas/Samtykkehendelse"
        syntetisk:
          type: boolean

    Oppgavestatus:
      type: string
      description: Kodeverket ligger i apps/fiks-simulator/src/oppgave.ts.
      enum: [OPPRETTET, UNDER_BEHANDLING, FERDIG, AVVIST]

    Oppgave:
      type: object
      properties:
        oppgaveId:
          type: string
        personId:
          type: string
        soknadId:
          type: string
        tittel:
          type: string
        status:
          $ref: "#/components/schemas/Oppgavestatus"
        opprettet:
          type: string
          format: date-time
        sporingsId:
          type: string
        historikk:
          type: array
          items:
            type: object
            properties:
              tidspunkt:
                type: string
                format: date-time
              status:
                $ref: "#/components/schemas/Oppgavestatus"
        syntetisk:
          type: boolean

    Informasjonsdel:
      type: string
      description: >-
        Delene Folkeregisteret kan svare med. Kodeverket ligger i
        apps/fiks-simulator/src/folkeregister.ts; hvilken delmengde et oppslag
        får avgjøres av rollen. Merk forelderbarnrelasjon uten binde-e —
        Skatteetatens nøkkel, en annen enn personer-datasettets
        foreldrebarnrelasjon.
      enum: [personnavn, foedselsdato, kjoenn, personstatus, doedsfall, sivilstand, bostedsadresse, kontaktadresse, forelderbarnrelasjon, familierelasjon, foreldreansvar, adressebeskyttelse]

    Melding:
      type: object
      properties:
        meldingId:
          type: string
        tittel:
          type: string
        innhold:
          type: string
        opprettet:
          type: string
          format: date-time
        syntetisk:
          type: boolean

    Kontakt:
      type: object
      description: >-
        Tenor-importerte personer har `kontakt: {}`. Nøkkelsettet er frosset
        wire-format — kode som skriver felt inn her endrer kontrakten.
      properties:
        epost:
          type: string
          nullable: true
        telefon:
          type: string
          nullable: true

    Adresse:
      type: object
      description: >-
        Gatenavn, husnummer, postnummer og poststed nulles for
        adressebeskyttede. Kommune og kommunenummer overlever, fordi
        regelmotoren trenger dem.
      properties:
        adressenavn:
          type: string
          nullable: true
        husnummer:
          type: integer
          nullable: true
        postnummer:
          type: string
          nullable: true
        poststed:
          type: string
          nullable: true
        kommune:
          type: string
        kommunenummer:
          type: string

    Person:
      type: object
      properties:
        personId:
          type: string
        syntetiskFodselsnummer:
          type: string
          description: Overlever maskeringen — oppslaget mot inntekt trenger det.
        navn:
          type: object
          properties:
            fornavn:
              type: string
            mellomnavn:
              type: string
            etternavn:
              type: string
        foedselsdato:
          type: string
          format: date
        personstatus:
          type: string
          enum: [BOSATT, UTFLYTTET, DOED, INAKTIV, MIDLERTIDIG, OPPHOERT, FORSVUNNET]
        doedsdato:
          type: string
          format: date
          nullable: true
          description: Satt hvis og bare hvis personstatus er DOED.
        bostedsadresse:
          $ref: "#/components/schemas/Adresse"
        kontakt:
          $ref: "#/components/schemas/Kontakt"
        husstandId:
          type: string
          nullable: true
          description: null for alle som ikke er BOSATT.
        adressebeskyttelse:
          type: string
          enum: [UGRADERT, FORTROLIG, STRENGT_FORTROLIG]
        skjermet:
          type: boolean
        syntetisk:
          type: boolean

    Husstand:
      type: object
      properties:
        husstandId:
          type: string
        adresse:
          type: string
          nullable: true
          description: Null når alle medlemmene er skjermet.
        kommune:
          type: string
        medlemmer:
          type: array
          items:
            type: object
            properties:
              personId:
                type: string
              rolle:
                type: string
                enum: [foresatt, barn]
        syntetisk:
          type: boolean

    Inntekt:
      type: object
      properties:
        personId:
          type: string
        identifikator:
          type: string
        inntektsaar:
          type: integer
        stadie:
          type: string
          enum: [OPPGJOER, UTKAST, UKJENT]
        skatteoppgjoersdato:
          type: string
          format: date
        poster:
          type: array
          items:
            type: object
            properties:
              tekniskNavn:
                type: string
              visningstekst:
                type: string
              beloep:
                type: integer
                format: int64
              kilde:
                type: string
              medregnes:
                type: boolean
                description: Poster som ikke medregnes føres som SUBTRAHERE i beregningen.
              infotekst:
                type: string
        syntetisk:
          type: boolean

    Barnehageplass:
      type: object
      description: >-
        Raden returneres urørt fra data/barnehageplasser.json. Feltet het
        `barnehage` her, som ikke finnes i dataene.
      properties:
        personId:
          type: string
        barnehageId:
          type: string
        barnehagenavn:
          type: string
        kommune:
          type: string
        plassprosent:
          type: integer
        manedspris:
          type: integer
        syntetisk:
          type: boolean

  securitySchemes:
    maskinporten:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Maskin-til-maskin. RS256-signert JWT fra digdir-mock, hentet med
        grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer mot POST /token.
        Krever aud `fiks-simulator` — et token utstedt for en annen tjeneste avvises
        med 401, som er hele poenget med audience-begrensning.

        Fem flater, fem scope, fordi scopet *er* hjemmelen: `ks:fiks:register`
        for registeroppslag, `ks:fiks:folkeregister` for Folkeregisteret (egen
        stifamilie, eget hjemmelsgrunnlag — et register-token åpner det ikke),
        `ks:fiks:samtykke` for å be om, svare på og trekke et samtykke,
        `ks:fiks:oppgave` for oppgavekøen og `ks:fiks:melding` for meldinger.
        Et oppgave-scope åpner ikke samtykkeflaten.

        Innbyggerens eget ID-porten-token avvises på alle fem med 403
        `KREVER_MASKINPORTEN`: samtykke *spørres om* av en kommune og svares
        gjennom den. `sandbox-backend` holder det verifiserte innbyggertokenet,
        avgjør, og navngir innbyggeren i `aktor` på vei ut — hjemmelen er maskinens,
        handlingen er innbyggerens.

        Hent ett med `scripts/token.ts --maskinporten <scope> --resource fiks-simulator`.
    idporten:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Innbygger. RS256-signert JWT fra digdir-mock via authorization_code med
        PKCE. Bærer `pid` (fødselsnummer) og `acr`. Tokenets `pid` må slå opp til
        den personen forespørselen gjelder — ellers 403, ikke 401: forskjellen på
        «vi vet ikke hvem du er» og «vi vet, og du har ikke lov».
        Hent ett med `scripts/token.ts --innbygger <personId>`.
