openapi: 3.1.0
info:
  title: MCP Services API
  version: 0.1.0
  description: MCP-style HTTP tool endpoints for process orchestration.
servers:
  - url: http://localhost:8083
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /mcp/tools:
    get:
      summary: List available tools
      responses:
        "200":
          description: Tool list
  /mcp/tools/invoke:
    post:
      summary: Invoke a named tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeToolRequest"
      responses:
        "200":
          description: Tool response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeToolResponse"

components:
  schemas:
    ProsessInfo:
      type: object
      required: [id, navn, beskrivelse, antallSteg]
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        antallSteg:
          type: integer
    ListProcessesResult:
      type: object
      required: [count, prosesser, antallMaler, maler]
      properties:
        count:
          type: integer
        prosesser:
          type: array
          items:
            $ref: "#/components/schemas/ProsessInfo"
        antallMaler:
          type: integer
        maler:
          type: array
          items:
            $ref: "#/components/schemas/ProsessInfo"
    InvokeToolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            Tool-navn. Gyldige verdier: list_processes, list_people, start_process_session,
            get_session, answer_question, consent_response, run_current_action,
            next_step, previous_step, interpret_reply, get_household_income,
            check_eligibility, list_schemes, match_process_choice, get_audit_log,
            matrikkel_finn_veger, matrikkel_hent_eiendom, matrikkel_hent_eiere,
            suggest_step_tools.
        arguments:
          type: object
          additionalProperties: true
        args:
          type: object
          additionalProperties: true
        toolArgs:
          type: object
          additionalProperties: true
    InvokeToolResponse:
      type: object
      required: [ok, tool, result]
      properties:
        ok:
          type: boolean
        tool:
          type: string
        result:
          oneOf:
            - $ref: "#/components/schemas/ListProcessesResult"
            - $ref: "#/components/schemas/MatrikkelGate"
            - type: array
              items:
                $ref: "#/components/schemas/MatrikkelGate"
            - $ref: "#/components/schemas/MatrikkelEiendom"
            - $ref: "#/components/schemas/MatrikkelEiereResult"
            - $ref: "#/components/schemas/SuggestStepToolsResult"
            - type: object
              additionalProperties: true

    MatrikkelGate:
      type: object
      description: Street match returned from matrikkel_finn_veger (from mock or live Geonorge lookup depending on MATRIKKEL_MODE).
      properties:
        gateId:
          type: string
        adressenavn:
          type: string
        kommunenummer:
          type: string
        kommune:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        antallEiendommer:
          type: integer

    MatrikkelEiendom:
      type: object
      description: Property result from matrikkel_hent_eiendom. In live/hybrid mode, exact address lookups may come from Geonorge instead of the local mock.
      properties:
        matrikkelId:
          type: string
        gnr:
          type: integer
        bnr:
          type: integer
        festenummer:
          type: integer
        undernummer:
          type: integer
        adressekode:
          type: integer
        adresse:
          type: string
        husnummer:
          type: integer
        husbokstav:
          type: string
        bruksenhetstype:
          type: string
        adressenavn:
          type: string
        kommunenummer:
          type: string
        kommune:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        objtype:
          type: string
        eiere:
          type: array
          items:
            type: string
        syntetisk:
          type: boolean
        kilde:
          type: object
          additionalProperties: true

    MatrikkelEiereResult:
      type: object
      properties:
        matrikkelId:
          type: string
        gnr:
          type: integer
        bnr:
          type: integer
        adresse:
          type: string
        eiere:
          type: array
          items:
            type: string
        antallEiere:
          type: integer
        syntetisk:
          type: boolean
        kilde:
          type: object
          additionalProperties: true
        merknad:
          type: string

    SuggestStepToolsResult:
      type: object
      properties:
        verktoy:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              bruk:
                type: string
                enum: [kontekst, validering, kontekst_og_validering]
              begrunnelse:
                type: string
        modell:
          type: string
        syntetisk:
          type: boolean

