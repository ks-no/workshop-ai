openapi: 3.1.0
info:
  title: MCP Services API
  version: 0.1.0
  description: MCP-style HTTP tool endpoints for process orchestration.
servers:
  - url: http://localhost:8083
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /mcp/tools:
    get:
      summary: List available tools
      responses:
        "200":
          description: Tool list
  /mcp/tools/invoke:
    post:
      summary: Invoke a named tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeToolRequest"
      responses:
        "200":
          description: Tool response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeToolResponse"

components:
  schemas:
    ProsessInfo:
      type: object
      required: [id, navn, beskrivelse, antallSteg]
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        antallSteg:
          type: integer
    ListProcessesResult:
      type: object
      required: [count, prosesser, antallMaler, maler]
      properties:
        count:
          type: integer
        prosesser:
          type: array
          items:
            $ref: "#/components/schemas/ProsessInfo"
        antallMaler:
          type: integer
        maler:
          type: array
          items:
            $ref: "#/components/schemas/ProsessInfo"
    InvokeToolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Tool-navn, for eksempel list_processes, interpret_reply, match_process_choice eller previous_step.
        arguments:
          type: object
          additionalProperties: true
        args:
          type: object
          additionalProperties: true
        toolArgs:
          type: object
          additionalProperties: true
    InvokeToolResponse:
      type: object
      required: [ok, tool, result]
      properties:
        ok:
          type: boolean
        tool:
          type: string
        result:
          oneOf:
            - $ref: "#/components/schemas/ListProcessesResult"
            - type: object
              additionalProperties: true

