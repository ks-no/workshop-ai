openapi: 3.1.0
info:
  title: MCP Services API
  version: 0.1.0
  description: MCP-style HTTP tool endpoints for process orchestration.
servers:
  - url: http://localhost:8083
# Ingen av rutene her krever token, og det er et valg, ikke en glipp.
# mcp-services er en intern verktøyflate som kalles av process-agent og demo-GUI-ene, og som selv henter et Maskinporten-token når den kaller sandbox-backend. Innkommende kall verifiseres ikke.
# En tom security på dokumentnivå gjelder alle operasjonene under paths.
security: []

paths:
  /helse:
    get:
      summary: Helsesjekk
      responses:
        "200":
          description: Tjenesten svarer
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  tjeneste:
                    type: string
                  tidspunkt:
                    type: string
                    format: date-time
  /docs:
    get:
      summary: Ruteoversikt som HTML
      security: []
      description: >
        Generert av spesifikasjonen, ikke skrevet for hånd: en håndskrevet liste er
        en tredje sannhet ved siden av koden og filen, og den driver i stillhet.
      responses:
        "200":
          description: HTML-side
          content:
            text/html:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: Denne spesifikasjonen
      security: []
      description: >
        Tjenesten serverer sin egen spesifikasjon fra openapi/. Filen og koden
        holdes i takt av scripts/sjekk-openapi-dekning.ts.
      responses:
        "200":
          description: OpenAPI-dokumentet
          content:
            text/yaml:
              schema:
                type: string
  /openapi-ruter.json:
    get:
      summary: Spesifikasjonen lest, som JSON
      security: []
      description: >
        Den samme spesifikasjonen som /openapi.yaml, lest av
        apps/shared-ui/openapi.ts: én oppføring per operasjon, med sammendrag,
        hjemmel og parametere. Finnes fordi en nettleser ikke kan lese YAML uten en
        parser, og sandkassen har ingen. Dette er kilden API-utforskeren på
        http://localhost:3001/utforsker rendrer.
      responses:
        "200":
          description: Ruteoversikten
          content:
            application/json:
              schema:
                type: object
                properties:
                  tjeneste: { type: string }
                  beskrivelse: { type: string }
                  server: { type: string }
                  ruter:
                    type: array
                    items:
                      type: object
                      properties:
                        sti: { type: string }
                        metode: { type: string }
                        linje: { type: integer }
                        sammendrag: { type: string }
                        beskrivelse: { type: string }
                        security:
                          type: array
                          items: { type: string }
                          description: Ordningene ruta godtar. Tom liste betyr åpen.
                        scopes:
                          type: array
                          items: { type: string }
                        parametere:
                          type: array
                          items:
                            type: object
                            properties:
                              navn: { type: string }
                              plassering: { type: string }
                              paakrevd: { type: boolean }
                              eksempel: { type: string }
                              beskrivelse: { type: string }
                        kroppEksempel: { type: string }
  /mcp:
    get:
      summary: Tjenestens navn, protokoll og versjon
      description: >-
        Merk `protocol: mcp-style-http`. Dette er ikke Model Context Protocol:
        det finnes ingen JSON-RPC, ingen stdio og ingen SSE, så en MCP-klient kan
        ikke koble seg på. Verktøydefinisjonene har derimot riktig formede
        inputSchema, så veien til ekte MCP er kort.
      responses:
        "200":
          description: Tjenesteinformasjon
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  protocol:
                    type: string
                    enum: [mcp-style-http]
                  version:
                    type: string
  /mcp/tools:
    get:
      summary: List available tools
      responses:
        "200":
          description: Tool list
  /mcp/tools/invoke:
    post:
      summary: Invoke a named tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeToolRequest"
      responses:
        "200":
          description: Tool response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeToolResponse"

  /mcp/tools/{name}/invoke:
    post:
      summary: Kall et verktøy navngitt i stien
      description: >-
        Samme som POST /mcp/tools/invoke, men med verktøynavnet i stien framfor i
        kroppen. Argumentene tas fra `toolArgs`, `args` eller `arguments`.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toolArgs:
                  type: object
                args:
                  type: object
                arguments:
                  type: object
      responses:
        "200":
          description: Tool response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeToolResponse"

components:
  schemas:
    ProsessInfo:
      type: object
      required: [id, navn, beskrivelse, antallSteg]
      properties:
        id:
          type: string
        navn:
          type: string
        beskrivelse:
          type: string
        antallSteg:
          type: integer
    ListProcessesResult:
      type: object
      required: [count, prosesser, antallMaler, maler]
      properties:
        count:
          type: integer
        prosesser:
          type: array
          items:
            $ref: "#/components/schemas/ProsessInfo"
        antallMaler:
          type: integer
        maler:
          type: array
          items:
            $ref: "#/components/schemas/ProsessInfo"
    InvokeToolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            Tool-navn. Gyldige verdier: list_processes, get_process_definition,
            list_people, start_process_session, get_session, answer_question,
            consent_response, run_current_action, next_step, previous_step,
            interpret_reply, get_household_income, check_eligibility, list_schemes,
            match_process_choice, get_audit_log, matrikkel_finn_veger,
            matrikkel_hent_eiendom, matrikkel_hent_eiere, brreg_search_organisations,
            brreg_get_organisation, folkeregister_search_persons,
            folkeregister_get_person, suggest_step_tools, answer_citizen_question.


            answer_citizen_question besvarer et fritt spørsmål fra innbygger midt i
            en flyt. Den henter satser selv når kontekst.satser mangler, og kaller
            ai-gateway /ai/sporsmaal, som kjører sperrene. Den har ingen egen
            dataadgang og kan ikke nå samtykkesperret data.
        arguments:
          type: object
          additionalProperties: true
        args:
          type: object
          additionalProperties: true
        toolArgs:
          type: object
          additionalProperties: true
    InvokeToolResponse:
      type: object
      required: [ok, tool, result]
      properties:
        ok:
          type: boolean
        tool:
          type: string
        result:
          oneOf:
            - $ref: "#/components/schemas/ListProcessesResult"
            - $ref: "#/components/schemas/MatrikkelGate"
            - type: array
              items:
                $ref: "#/components/schemas/MatrikkelGate"
            - $ref: "#/components/schemas/MatrikkelEiendom"
            - $ref: "#/components/schemas/MatrikkelEiereResult"
            - $ref: "#/components/schemas/BrregOrganisation"
            - $ref: "#/components/schemas/BrregSearchResult"
            - $ref: "#/components/schemas/FolkeregisterPerson"
            - $ref: "#/components/schemas/FolkeregisterSearchResult"
            - $ref: "#/components/schemas/SuggestStepToolsResult"
            - type: object
              additionalProperties: true

    BrregOrganisation:
      type: object
      properties:
        organisasjonsnummer:
          type: string
        navn:
          type: string
        organisasjonsform:
          type: object
          properties:
            kode:
              type: string
              nullable: true
            beskrivelse:
              type: string
              nullable: true
        naeringKode:
          type: array
          items:
            type: string
        naeringBeskrivelse:
          type: array
          items:
            type: string
        registrertIForetaksregisteret:
          type: boolean
        registrertIMvaregisteret:
          type: boolean
        antallUnderenheter:
          type: integer
          nullable: true
        forretningsadresse:
          type: object
          additionalProperties: true
          nullable: true
        postadresse:
          type: object
          additionalProperties: true
          nullable: true
        telefonnummer:
          type: string
          nullable: true
        nettside:
          type: string
          nullable: true

    BrregSearchResult:
      type: object
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        count:
          type: integer
        organisasjoner:
          type: array
          items:
            $ref: "#/components/schemas/BrregOrganisation"

    FolkeregisterPerson:
      type: object
      properties:
        foedselsEllerDNummer:
          type: string
        personnavn:
          type: object
          properties:
            fornavn: { type: string, nullable: true }
            mellomnavn: { type: string, nullable: true }
            etternavn: { type: string, nullable: true }
        foedselsdato:
          type: string
          format: date
        kjoenn:
          type: string
          nullable: true
          enum: [MANN, KVINNE, null]
        sivilstand:
          type: string
          nullable: true
        bostedsadresse:
          type: object
          additionalProperties: true
          nullable: true
        personstatus:
          type: string
          enum: [BOSATT, UTFLYTTET, DOED, INAKTIV, MIDLERTIDIG, OPPHOERT, FORSVUNNET]
        doedsfall:
          type: object
          nullable: true
          properties:
            doedsdato:
              type: string
              format: date
        forelderbarnrelasjon:
          type: array
          description: >
            Den grunne forelder/barn-visningen. relatertPersonsRolle er BARN, MOR,
            FAR eller MEDMOR, og kantene går begge veier.
          items:
            type: object
            additionalProperties: true
        familierelasjon:
          type: array
          description: >
            Folkeregisterets egen Familierelasjon, med rollen sett fra begge ender
            og registerets eget kodeverk (mor, far, medmor, barn, soesken,
            ektefelleEllerPartner). Her ligger ektefellen; forelderbarnrelasjon
            er navngitt for foreldre og barn.
          items:
            type: object
            additionalProperties: true
        foreldreansvar:
          type: string
          nullable: true
          enum: [felles, mor, far, medmor, andre, ukjent, null]
        skjermet:
          type: boolean
        kontakt:
          type: object
          additionalProperties: true
        _sandbox:
          type: object
          properties:
            personId: { type: string }
            husstandId: { type: string }
            rolle: { type: string }
            visningsnavn: { type: string }
        syntetisk:
          type: boolean

    FolkeregisterSearchResult:
      type: object
      properties:
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
        count: { type: integer }
        personer:
          type: array
          items:
            $ref: "#/components/schemas/FolkeregisterPerson"
        merknad:
          type: string
          nullable: true

    MatrikkelGate:
      type: object
      description: Street match returned from matrikkel_finn_veger (from mock or live Geonorge lookup depending on MATRIKKEL_MODE).
      properties:
        gateId:
          type: string
        adressenavn:
          type: string
        kommunenummer:
          type: string
        kommune:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        antallEiendommer:
          type: integer

    MatrikkelEiendom:
      type: object
      description: Property result from matrikkel_hent_eiendom. In live/hybrid mode, exact address lookups may come from Geonorge instead of the local mock.
      properties:
        matrikkelId:
          type: string
        gnr:
          type: integer
        bnr:
          type: integer
        festenummer:
          type: integer
        undernummer:
          type: integer
        adressekode:
          type: integer
        adresse:
          type: string
        husnummer:
          type: integer
        husbokstav:
          type: string
        bruksenhetstype:
          type: string
        adressenavn:
          type: string
        kommunenummer:
          type: string
        kommune:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        objtype:
          type: string
        eiere:
          type: array
          items:
            type: string
        syntetisk:
          type: boolean
        kilde:
          type: object
          additionalProperties: true

    MatrikkelEiereResult:
      type: object
      properties:
        matrikkelId:
          type: string
        gnr:
          type: integer
        bnr:
          type: integer
        adresse:
          type: string
        eiere:
          type: array
          items:
            type: string
        antallEiere:
          type: integer
        syntetisk:
          type: boolean
        kilde:
          type: object
          additionalProperties: true
        merknad:
          type: string

    SuggestStepToolsResult:
      type: object
      properties:
        verktoy:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              bruk:
                type: string
                enum: [kontekst, validering, kontekst_og_validering]
              begrunnelse:
                type: string
        modell:
          type: string
        syntetisk:
          type: boolean

