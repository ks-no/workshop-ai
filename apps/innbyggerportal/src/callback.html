<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logger deg inn | Stavanger kommune</title>

    <!--
      Fargemodus og tekststørrelse settes før første maling, ellers blinker siden
      lys før scriptet rekker å slå om. Valget gjøres i toppfeltet på forsiden,
      og data-color-scheme er designsystemets eget attributt.
    -->
    <script>
      try {
        const tema = sessionStorage.getItem("sk-tema");
        if (tema) document.documentElement.setAttribute("data-color-scheme", tema);
        const tekst = sessionStorage.getItem("sk-tekst");
        if (tekst) document.documentElement.setAttribute("data-tekst", tekst);
      } catch (feil) {
        /* Privat vindu uten sessionStorage. Standardvisningen er riktig nok. */
      }
    </script>
    <link
      rel="stylesheet"
      href="https://static.fiks.ks.no/googlefonts/googleapis/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/assets/ds-base.css" />
    <link rel="stylesheet" href="/assets/ds-ksdigital.css" />
    <style>
      @layer side;

      @layer side {
        :root[data-tekst="stor"] {
          font-size: 118%;
        }

        body {
          margin: 0;
          background: var(--ds-color-background-tinted);
          color: var(--ds-color-text-default);
          font-family: var(--ds-font-family);
        }

        main {
          max-width: 34rem;
          margin: 0 auto;
          padding: var(--ds-size-18) var(--ds-size-4);
          display: grid;
          gap: var(--ds-size-4);
        }

        [hidden] {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1 class="ds-heading" data-size="md" id="tittel">Logger deg inn …</h1>
      <p class="ds-paragraph" id="melding">
        Veksler engangskoden fra ID-porten mot et token.
      </p>
      <p hidden id="tilbake">
        <a class="ds-link" href="/">Tilbake til forsiden</a>
      </p>
    </main>

    <script src="/delt/felles.ts"></script>
    <script type="module" src="/client/callback.ts"></script>
  </body>
</html>
