<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Innbyggerdialog Chat</title>
    <link rel="stylesheet" href="/assets/felles.css" />
    <style>
      main { max-width: 920px; }
      .card { padding: 18px; }
      .row { margin-bottom: 10px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .chat { min-height: 460px; max-height: 620px; }
      textarea { min-height: 90px; }
      #sessionInfo { margin: 8px 0 10px 0; }
      #oektStatus { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin: 0 0 10px 0; }
      #oektStatus span { color: var(--farge-tekst-dempet); }
      @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="top-links" id="toppmeny"></div>
      <h1>Innbyggerdialog Chat</h1>
      <p class="muted small"><strong>Du er her:</strong> samme prosessmotor som den stegvise
        demoen, pakket som dialog. Du velger prosess selv, og kan stille spørsmål
        underveis uten å miste flyten.
        <a href="/stegvis">Stegvis</a> viser rå JSON og revisjonslogg;
        <a href="/agent">AI-agenten</a> velger prosess for deg.</p>

      <!-- Uten dette banneret er en daud modell usynlig: ai-gateway faller
           tilbake til maltekst, og svarene ser helt normale ut. -->
      <div id="modellBanner" hidden></div>

      <section class="card">
        <div class="two-col">
          <div class="row">
            <label for="person" class="label">Testbruker</label>
            <select id="person"></select>
          </div>
          <div class="row">
            <label for="prosess" class="label">Prosess</label>
            <select id="prosess"></select>
          </div>
        </div>

        <div class="actions">
          <button id="start">Start chat</button>
          <button id="reset" class="secondary">Nullstill chat</button>
        </div>

        <div id="sessionInfo" class="muted small">Ingen aktiv prosess.</div>

        <!-- Samtykke, syntetisk-merking og sporet er selve poenget med sandboxen.
             Ligger de bare i API-svaret, ser ingen dem under en demo. -->
        <p id="oektStatus"></p>

        <div id="chat" class="chat" aria-live="polite"></div>

        <div class="actions" id="quickActions"></div>

        <div class="row" style="margin-top:12px">
          <label for="input">Skriv melding</label>
          <textarea id="input" placeholder="Skriv svaret ditt her, eller still et spørsmål... (Enter for send, Shift+Enter for ny linje)"></textarea>
        </div>
        <div class="actions">
          <button id="send">Send</button>
        </div>
      </section>
    </main>

    <script src="/delt/felles.ts"></script>
    <script type="module" src="/client/chat.ts"></script>
  </body>
</html>
