<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Innbyggerdialog – AI-agent</title>
    <link rel="stylesheet" href="/assets/felles.css" />
    <style>
      main { max-width: 760px; }
    </style>
  </head>
  <body>
    <main>
      <div class="top-links" id="toppmeny"></div>
      <h1>Innbyggerdialog – AI-agent</h1>
      <p class="muted small"><strong>Du er her:</strong> agenten velger
        prosess og styrer flyten selv - du svarer bare naturlig. Den er bevisst
        middelmådig, og å slå den er en av oppgavene.
        <a href="/stegvis">Stegvis</a> viser rå JSON og revisjonslogg;
        <a href="/chat">Chat</a> lar deg velge prosess selv.</p>

      <!-- Agenten er helt avhengig av modellen for intent-tolkning. Er den nede,
           faller den tilbake til heuristikk uten å si fra. -->
      <div id="modellBanner" hidden></div>

      <section class="card">
        <div class="row">
          <label for="person">Testbruker</label>
          <select id="person" style="width:100%"></select>
        </div>
        <div class="actions">
          <button id="start">Start med AI-agent</button>
          <button id="reset" class="secondary">Nullstill</button>
        </div>

        <div id="sessionInfo" class="muted small">Ingen aktiv agent-sesjon.</div>
        <div id="chat" class="chat" aria-live="polite"></div>

        <div class="row">
          <label for="input">Din melding</label>
          <textarea id="input" placeholder="Skriv svaret ditt her... (Enter = send, Shift+Enter = ny linje)"></textarea>
        </div>
        <div class="actions">
          <button id="send">Send</button>
        </div>
      </section>
    </main>

    <script src="/delt/felles.ts"></script>
    <script type="module" src="/client/agent.ts"></script>
  </body>
</html>
